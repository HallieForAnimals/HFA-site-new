against%20a%20third%20party%2C%20with%20no%20connection%20to%20any%20training%20purpose.%0A%0APaying%20members%20are%20funding%20and%20learning%20from%20this%20approach%20to%20dogs%3A%0A%0A1%3A%20Review%20all%20content%20on%20the%20Day%20to%20Day%20Dog%20Training%20Patreon%20page%20against%20Patreon's%20Animal%20abuse%20guidelines.%0A2%3A%20Suspend%20the%20page's%20ability%20to%20earn%20money%20pending%20that%20review.%0A3%3A%20Remove%20the%20page%20under%20Patreon's%20Animal%20abuse%20guidelines.%0A4%3A%20Publicly%20confirm%20the%20action%20taken.%0A5%3A%20Send%20case%20status%20updates%20to%20contact%40hallieforanimals.org%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F17iIscslQ3mDJrWt1djhqh7NAEDbsKXA9%2Fview%3Fusp%3Dsharing%0APhoto%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F10lrEfLieolYw9117mwraWQeN6Sgp9jsr%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
