d%20%E2%80%94%20before%20any%20firearm%20is%20used.%0A2%3A%20Reclassify%20the%20discharge%20of%20a%20firearm%20at%20an%20animal%20as%20a%20use-of-force%20incident%20subject%20to%20the%20same%20review%20as%20any%20other%20use%20of%20force%2C%20ending%20the%20current%20exemption.%0A3%3A%20Mandate%20canine-encounter%20and%20animal-behavior%20training%20for%20all%20officers%2C%20using%20the%20U.S.%20Department%20of%20Justice%20COPS%20Office%20%22Police%20and%20Dog%20Encounters%22%20curriculum%2C%20available%20to%20departments%20at%20no%20cost.%0A4%3A%20Publicly%20release%20the%20findings%20of%20the%20review%20into%20Ammo's%20death%20and%20issue%20a%20public%20statement%20on%20the%20changes%20adopted.%0A%0ALittle%20Rock%20does%20not%20need%20a%20villain%20to%20fix%20this.%20It%20needs%20a%20procedure%20that%20stops%20treating%20a%20dog's%20life%20as%20beneath%20the%20standard%20applied%20to%20every%20other%20use%20of%20force.%20Ammo%20could%20not%20be%20blamed%20for%20what%20happened.%20He%20is%20the%20only%20one%20who%20paid%20for%20it.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1hllyjdwAJC7RZCm0HoHfZXbKFC_ygXNu%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
