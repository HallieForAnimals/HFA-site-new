o%20de%20la%20investigaci%C3%B3n%20en%20la%20medida%20en%20que%20lo%20permita%20la%20ley.%0A%0AEntiendo%20que%20existen%20protecciones%20legales%20que%20rigen%20este%20tipo%20de%20casos%2C%20y%20no%20estoy%20pidiendo%20que%20se%20haga%20caso%20omiso%20de%20ninguna%20de%20ellas.%20Lo%20que%20pido%20es%20que%20la%20denuncia%20ya%20presentada%20sea%20investigada%20con%20seriedad%20y%20que%20la%20fiscal%C3%ADa%20act%C3%BAe%20con%20la%20diligencia%20que%20exige%20la%20gravedad%20de%20estos%20actos.%0A%0AGracias%20por%20su%20atenci%C3%B3n%20y%20su%20compromiso%20con%20la%20justicia.%0A%0APrueba%20en%20video%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1ZZvikKNewH0WFYWkEFgtGKtcXhmSP0gI%2Fview%3Fusp%3Dsharing%0A%0AAtentamente%2C%0A%0A%0A%0AEquipo%20de%20%40HallieForAnimals%0Acontact%40hallieforanimals.org%0A%0A%0A%0A%0A%0ATo%20whom%20it%20may%20concern%2C%0A%0AI%20am%20writing%20regarding%20the%20animal%20cruelty%20case%20in%20the%20commune%20of%20La%20Florida%2C%20circulated%20widely%20on%20social%20media%20between%20August%2024%20and%2025%2C%202026%2C%20showing%20acts%20of%20severe%20cruelty%20toward%20one%20or%20more%20animals.%0A%0AThe%20case%20has%20already%20been%20formally%20reported.%20Colegio%20Licaray%C3%A9n%20confirmed%20it%20received%20the%20information%2C%20filed%20a%20complaint%20with%20the%20authorities%2C%20and%20applied%20its%20internal%20protocols.%20The%20Municipalidad%20de%20La%20Florida%20condemned%20the%20acts%20and%20instructed%20its%20legal%20team%20to%20lodge%20a%20complaint%20with%20the%20Public%20Ministry.%20I%20write%2C%20alongside%20many%20others%2C%20to%20ask%20that%20this%20case%20not%20stall%20at%20the%20complaint%20stage%3A%0A%0A1%3A%20Investigate%20the%20facts%20actively%20and%20promptly%2C%20and%20do%20not%20allow%20the%20case%20to%20stall.%0A2%3A%20Urgently%20collect%20and%20preserve%20the%20audiovisual%20evidence%20circulating%20on%20social%20media%20before%20it%20is%20deleted.%0A3%3A%20Verify%20the%20welfare%20and%20safety%20of%20any%20animal%20still%20in%20the%20home%20or%20under%20the%20responsible%20party's%20care%2C%20coordinating%20with%20the%20competent%20bodies%20as%20needed.%0A4%3A%20Apply%20Article%20291%20bis%20of%20the%20Penal%20Code%20and%20Law%2021.020%20(%22Ley%20Cholito%22)%2C%20within%20whatever%20procedural%20framework%20applies.%0A5%3A%20Report%20on%20the%20status%20of%20the%20investigation%20to%20the%20extent%20the%20law%20permits.%0A%0AI%20understand%20there%20are%20legal%20protections%20governing%20this%20type%20of%20case%2C%20and%20I%20am%20not%20asking%20that%20any%20of%20them%20be%20set%20aside.%20I%20am%20asking%20that%20the%20complaint%20already%20filed%20receive%20a%20serious%20investigation%2C%20and%20that%20the%20office%20act%20with%20the%20diligence%20the%20gravity%20of%20these%20acts%20demands.%0A%0AThank%20you%20for%20your%20attention%20and%20your%20commitment%20to%20justice.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1ZZvikKNewH0WFYWkEFgtGKtcXhmSP0gI%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org https://lnk.bio/hallieforanimals https://lnk.bio/hallieforanimals (same as return) "mailto:denuncia@minpublico.cl,defensoriadelagente@laflorida.cl?subject=Solicitud%20para%20investigar%20y%20avanzar%2FRequest%20to%20investigate%20and%20advance&body=A%20quien%20corresponda%3A%0A%0ALes%20escribo%20en%20relaci%C3%B3n%20con%20el%20caso%20de%20maltrato%20animal%20ocurrido%20en%20la%20comuna%20de%20La%20Florida%2C%20que%20se%20difundi%C3%B3%20ampliamente%20en%20las%20redes%20sociales%20entre%20el%2024%20y%20el%2025%20de%20agosto%20de%202026%2C%20y%20en%20el%20que%20se%20muestran%20actos%20de%20grave%20crueldad%20hacia%20uno%20o%20m%C3%A1s%20animales.%0A%0AEl%20caso%20ya%20ha%20sido%20denunciado%20formalmente.%20El%20Colegio%20Licaray%C3%A9n%20confirm%C3%B3%20que%20recibi%C3%B3%20la%20informaci%C3%B3n%2C%20present%C3%B3%20una%20denuncia%20ante%20las%20autoridades%20y%20aplic%C3%B3%20s
