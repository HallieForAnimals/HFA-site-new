red%20on%20November%201%2C%20examined%20by%20a%20veterinarian%2C%20with%20the%20findings%20documented%20as%20evidence%0A3%3A%20Complete%20the%20warden%E2%80%99s%20report%20and%20deliver%20it%20to%20the%20Prosecutor%E2%80%99s%20Office%20without%20further%20delay%0A4%3A%20File%20charges%20under%20R.C.%20959.131%20for%20every%20dog%20the%20evidence%20supports%0A5%3A%20Upon%20conviction%2C%20seek%20a%20court%20order%20barring%20Bill%20Simerly%20from%20owning%20or%20keeping%20animals%0A6%3A%20Confirm%20whether%20and%20when%20the%20written%20notification%20required%20by%20R.C.%20955.12(D)%20was%20made%0A7%3A%20Issue%20a%20public%20statement%20on%20the%20status%20of%20the%20remaining%20dogs%20and%20the%20charging%20decision%0A8%3A%20Release%20the%20investigation%E2%80%99s%20findings%20publicly%20once%20complete%0A9%3A%20Send%20all%20updates%20on%20this%20case%20to%20contact%40hallieforanimals.org%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1y5GwmoR8Qo4Gg0ipShZbUIu5Pg6lLt3T%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";

    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';

        window.location.href = MAILTO;

      }
      launched = true;
      launchAtMs = Date.now();

    setTimeout(goMail, 200);
    function goBack() {

    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;

      if (launched) blurredAfterLaunch = true;

      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
