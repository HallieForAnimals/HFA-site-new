    var MAILTO = "mailto:downeyctaip@animalcare.lacounty.gov,HollyJMitchell@bos.lacounty.gov,vpuebla@lasd.org,nhochman@da.lacounty.gov?subject=Two%20dogs%20chained%20in%20full%20sun%20without%20food%20or%20water&body=To%20whom%20it%20may%20concern%2C%0A%0AI%20am%20writing%20about%20two%20black%20dogs%20chained%20against%20a%20concrete%20wall%20in%20the%203100%E2%80%933298%20block%20of%20N%20Alameda%20Street%2C%20Compton%2C%20CA%2090222.%0A%0ABoth%20dogs%20are%20restrained%20by%20heavy%20chains%20anchored%20overhead%2C%20kept%20in%20direct%20sun%20with%20only%20a%20torn%20tarp%20for%20cover%2C%20and%20have%20been%20reported%20to%20have%20no%20food%20or%20water.%20Photographs%20show%20the%20dogs%20panting%20on%20bare%20ground%20among%20debris%2C%20with%20no%20shade%20structure%2C%20no%20water%20container%20and%20no%20bedding.%0A%0ASheriff's%20deputies%20attended%20and%20left%20the%20dogs%20where%20they%20were.%20The%20Department%20of%20Animal%20Care%20and%20Control%2C%20which%20provides%20animal%20control%20services%20to%20the%20City%20of%20Compton%2C%20has%20reportedly%20declined%20to%20act%20because%20the%20complaint%20came%20from%20a%20third%20party.%20Third-party%20reports%20are%20how%20animal%20cruelty%20and%20neglect%20are%20reported%3B%20the%20Department's%20own%20website%20asks%20members%20of%20the%20public%20to%20report%20suspected%20neglect.%0A%0ATethering%20a%20dog%20to%20a%20stationary%20object%20for%20more%20than%20three%20hours%20in%20a%2024-hour%20period%20violates%20California%20Health%20and%20Safety%20Code%20122335.%20Failing%20to%20provide%20an%20animal%20with%20proper%20food%2C%20water%20and%20shelter%20is%20a%20crime%20under%20Penal%20Code%20597(b)%20and%20597.1(a).%20Penal%20Code%20597.1%20authorizes%20officers%20to%20take%20possession%20of%20an%20animal%20without%20a%20warrant%20when%20the%20animal's%20health%20is%20endangered.%20I%20am%20asking%20the%20Sheriff's%20Department%2C%20the%20County%2C%20the%20City%20and%20the%20District%20Attorney's%20Office%20to%3A%0A%0A1.%20Conduct%20a%20same-day%20welfare%20inspection%20of%20both%20dogs%20by%20animal%20control%2C%20with%20a%20deputy%20present.%0A2.%20Take%20possession%20of%20both%20dogs%20under%20Penal%20Code%20597.1%20if%20they%20are%20without%20adequate%20food%2C%20water%20or%20shade.%0A3.%20Cite%20the%20tethering%20violation%20under%20Health%20and%20Safety%20Code%20122335.%0A4.%20Open%20a%20neglect%20investigation%20under%20Penal%20Code%20597(b)%20and%20597.1%20and%20refer%20the%20findings%20to%20the%20District%20Attorney.%0A5.%20Review%20the%20deputies'%20decision%20to%20leave%20the%20dogs%20in%20these%20conditions%20and%20confirm%20the%20outcome%20of%20that%20review.%0A6.%20Confirm%20that%20third-party%20reports%20of%20animal%20neglect%20are%20accepted%20and%20acted%20on%2C%20and%20correct%20any%20guidance%20stating%20otherwise.%0A7.%20Issue%20a%20public%20statement%20on%20what%20has%20been%20done%20for%20these%20two%20dogs%2C%20and%20send%20updates%20to%20contact%40hallieforanimals.org.%0A%0AThese%20dogs%20have%20been%20reported%2C%20seen%20by%20deputies%20and%20photographed.%20They%20need%20to%20be%20removed%20from%20that%20wall.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1z5pAzJOWCk3pKQiFK84T7CWVWxKO4H2V%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
</body>
</html>
