    var MAILTO = "mailto:info@horrycountysc.gov?subject=Prosecute%20Ralph%20and%20Kimberly%20Moody&body=To%20whom%20it%20may%20concern%2C%0A%0AOn%20July%209%2C%202026%2C%20Georgetown%20County%20deputies%20removed%20107%20dogs%20and%2011%20cats%20from%2021%20Duck%20Pond%20Place%2C%20Wedgefield.%20The%20house%20was%20so%20contaminated%20it%20had%20to%20be%20ventilated%20before%20rescuers%20could%20enter.%20The%20remains%20of%20more%20than%20125%20dogs%20were%20recovered%20from%20the%20property.%20Eight%20surviving%20dogs%20were%20so%20badly%20neglected%20they%20had%20to%20be%20euthanized.%0A%0ABefore%20the%20search%2C%20Ralph%20Moody%20told%20deputies%20he%20had%20five%20dogs%20and%20that%20the%20smell%20was%20trash.%20Flock%20cameras%20tied%20his%20truck%20to%20sites%20across%20the%20county%20where%20more%20than%2050%20dogs%20had%20been%20dumped%20in%20the%20preceding%20two%20weeks%2C%20and%20he%20admitted%20to%20abandoning%20animals.%0A%0AIn%20court%2C%20the%20defense%20presented%20this%20as%20desperation%20and%20claimed%20the%20Moodys%20have%20no%20criminal%20past.%20Deputies%20have%20responded%20to%20more%20than%2025%20complaints%20at%20this%20home%20since%202019%2C%20and%20Ralph%20Moody%20reportedly%20told%20deputies%20he%20had%20previously%20been%20charged%20with%20abandoning%20dogs%20at%20Saint%20Frances.%20This%20did%20not%20happen%20by%20accident.%20It%20was%20years%20of%20warnings%20and%20a%20pattern.%0A%0ASouth%20Carolina%20already%20treats%20torture%20and%20the%20infliction%20of%20excessive%20or%20repeated%20unnecessary%20suffering%20as%20a%20felony%20under%20%C2%A7%2047-1-40(B).%20This%20case%20meets%20that%20standard%20many%20times%20over.%20Further%20down%20the%20coast%2C%20Florida%20has%20made%20clear%20that%20cases%20like%20this%20end%20in%20prison%20time%2C%20ownership%20bans%2C%20and%20a%20public%20registry%2C%20through%20Ponce's%20Law%20and%20Dexter's%20Law.%20South%20Carolina%20should%20be%20sending%20the%20same%20message%2C%20and%20this%20prosecution%20is%20where%20it%20starts.%0A%0AI%20am%20calling%20on%20the%2015th%20Circuit%20Solicitor's%20Office%20to%3A%0A%0A1%3A%20Prosecute%20both%20defendants%20on%20the%20felony%20torture%20charges%20under%20%C2%A7%2047-1-40(B)%2C%20with%20charges%20brought%20for%20each%20animal%20the%20evidence%20supports%0A2%3A%20Refuse%20any%20plea%20that%20reduces%20this%20case%20to%20misdemeanor%20counts%0A3%3A%20Seek%20the%20maximum%20sentence%20available%20on%20every%20count%0A4%3A%20Seek%20a%20lifetime%20ban%20on%20both%20defendants%20owning%2C%20keeping%2C%20or%20living%20with%20animals%0A5%3A%20Seek%20full%20restitution%20to%20Saint%20Frances%20Animal%20Center%20and%20Georgetown%20County%20Animal%20Services%20for%20the%20cost%20of%20care%0A6%3A%20Publicly%20support%20statewide%20reform%20in%20South%20Carolina%20modeled%20on%20Florida's%20Dexter's%20Law%2C%20including%20a%20sentencing%20enhancement%20for%20aggravated%20cruelty%20and%20a%20statewide%20abuser%20registry%0A7%3A%20Issue%20a%20public%20statement%20on%20the%20status%20of%20this%20prosecution%0A8%3A%20Provide%20full%20transparency%20on%20the%20charges%2C%20court%20dates%2C%20and%20outcome%2C%20with%20updates%20sent%20to%20contact%40hallieforanimals.org%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F19YdEFi4F0hUzcVs0gtNnmme6oRSSfew9%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
</body>
</html>
