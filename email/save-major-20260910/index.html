  (function () {
    var MAILTO = "mailto:Deborah.Thomas@austintexas.gov,Kirk.Watson@austintexas.gov,Natasha.Harper-Madison@austintexas.gov,Vanessa.Fuentes@austintexas.gov,Jose.Velasquez@austintexas.gov,Chito.Vela@austintexas.gov,Ryan.Alter@austintexas.gov,Krista.Laine@austintexas.gov,Mike.Siegel@austintexas.gov,Paige.Ellis@austintexas.gov,Zohaib.Qadri@austintexas.gov,Marc.Duchen@austintexas.gov,susana.carbajal@austintexas.gov?subject=Do%20not%20euthanize%20Major%2C%20a%20qualified%20trainer%20is%20ready%20to%20take%20him&body=To%20whom%20it%20may%20concern%2C%0A%0AMajor%2C%20a%20Belgian%20Malinois%2C%20has%20been%20held%20in%20isolation%20in%20Kennel%20600%20at%20the%20Austin%20Animal%20Center%20since%20March%2031%2C%202025%2C%20more%20than%20500%20days%20and%20is%20scheduled%20to%20be%20euthanized.%20He%20was%20hit%20by%20a%20vehicle%20in%20March%202025.%20While%20his%20owner%20ran%20to%20get%20his%20phone%2C%20a%20passer-by%20tried%20to%20moved%20him%20out%20of%20the%20road%20and%20was%20bitten.%20That%20single%20bite%2C%20from%20a%20dog%20in%20extreme%20pain%20being%20handled%20by%20a%20stranger%2C%20is%20the%20entire%20basis%20for%20the%20order%20to%20kill%20him.%0A%0AThe%20person%20who%20was%20bitten%20does%20NOT%20want%20Major%20euthanized.%20She%20recognized%20his%20reaction%20as%20pain%20and%20fear%2C%20and%20she%20declined%20to%20testify%20against%20him.%20Jonas%20Black%2C%20a%20highly-qualified%20professional%20dog%20trainer%2C%20has%20formally%20agreed%20to%20take%20Major%20and%20rehabilitate%20him.%20And%20under%20Texas%20Health%20and%20Safety%20Code%20%C2%A7%20822.003%2C%20a%20dog's%20destruction%20is%20required%20ONLY%20where%20the%20dog%20caused%20a%20person's%20DEATH%3B%20where%20the%20finding%20is%20serious%20bodily%20injury%2C%20the%20court%20may%20instead%20release%20the%20dog%20under%20conditions.%20Major%20caused%20an%20injury%2C%20not%20a%20death%2C%20his%20euthanasia%20was%20never%20mandatory%2C%20and%20a%20conditional%20release%20remains%20legally%20available%20today.%0A%0AThe%20City%20brought%20this%20case%2C%20and%20the%20City%20can%20resolve%20it.%20We%20are%20not%20asking%20you%20to%20return%20a%20dangerous%20animal%20to%20the%20street%2C%20we%20are%20asking%20you%20to%20choose%20the%20outcome%20the%20law%20already%20allows%2C%20with%20safeguards%3A%0A%0A1%3A%20Take%20no%20action%20to%20euthanize%20Major.%0A2%3A%20Direct%20the%20City%20Attorney%20to%20return%20to%20the%20municipal%20court%20and%20support%20a%20conditional%20release%20of%20Major%20to%20Jonas%20Black%2C%20the%20highly-qualified%20dog%20trainer%20who%20has%20agreed%20to%20take%20him%2C%20under%20strict%20court-ordered%20safety%20conditions%2C%20professional%20rehabilitation%2C%20a%20secure%20enclosure%2C%20and%20muzzling%20in%20public.%0A3%3A%20Confirm%20publicly%20that%20Major%20will%20not%20be%20euthanized%20while%20that%20release%20is%20pursued.%0A4%3A%20Choose%20the%20conditional%20release%20the%20victim%2C%20the%20owner%2C%20and%20Jonas%20Black%20all%20support%20over%20destroying%20a%20dog%20who%20has%20already%20spent%20500%20days%20caged%20for%20surviving%20an%20accident.%0A5%3A%20Issue%20a%20public%20statement%20on%20this%20decision%20and%20release%20the%20records%20and%20findings%20behind%20it.%0A%0AMore%20than%20500%20days%20in%20a%20kennel%20is%20not%20public%20safety.%20It%20is%20a%20dog%20waiting%20to%20die%20for%20being%20run%20over%20and%20reacting%20in%20pain.%20End%20his%20imprisonment%20and%20release%20him%20to%20Jonas%20Black%2C%20the%20trainer%20who%20stands%20ready%20to%20take%20him%2C%20under%20whatever%20conditions%20keep%20the%20public%20safe.%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
</body>
</html>
