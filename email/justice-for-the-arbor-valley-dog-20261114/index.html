20as%20aggressive%2C%20so%20an%20officer%20should%20be%20present.%0A2%3A%20Seizure%20of%20the%20dog%20under%20Penal%20Code%20%C2%A7597.1.%0A3%3A%20A%20full%20cruelty%20investigation%20under%20Penal%20Code%20%C2%A7597(b)%2C%20with%20referral%20to%20the%20Santa%20Clara%20County%20District%20Attorney%20if%20the%20evidence%20supports%20it.%0A4%3A%20A%20review%20of%20every%20311%20complaint%20logged%20for%20this%20address%2C%20and%20an%20explanation%20of%20why%20repeated%20reports%20did%20not%20lead%20to%20effective%20action.%0A5%3A%20A%20public%20statement%20on%20the%20outcome%2C%20with%20findings%20released%20in%20full.%0A6%3A%20Updates%20on%20this%20case%20sent%20to%20contact%40hallieforanimals.org.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1Q_EE1icF-Hz6Q2o_va3SQcv9Hgaht01E%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
