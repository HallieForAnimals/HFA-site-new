    var MAILTO = "mailto:wscheiner@sa18.org?subject=Prosecute%20Richardson%20Noel%20to%20conviction%20for%20the%20aggravated%20cruelty%20attack%20on%20Boomer&body=To%20whom%20it%20may%20concern%2C%0A%0AYour%20office's%20stated%20mission%20is%20the%20vigorous%20prosecution%20of%20crime%20and%20advocacy%20for%20the%20rights%20of%20every%20victim.%20Boomer%20had%20no%20voice%20of%20his%20own%20and%20no%20way%20to%20defend%20himself%2C%20and%20I'm%20writing%20because%20this%20case%20is%20exactly%20the%20kind%20your%20office%20exists%20to%20carry%20through%2C%20and%20because%20Florida%20law%2C%20strengthened%20by%20Ponce's%20Law%20and%20now%20Dexter's%20Law%2C%20treats%20felony%20animal%20cruelty%20as%20the%20serious%20crime%20it%20is.%0A%0AIn%20Sanford%2C%20Richardson%20Noel%2C%20an%20HVAC%20worker%2C%20kicked%20Boomer%2C%20a%20twelve-year-old%20dog%20weighing%20just%20five%20pounds%2C%20with%20such%20force%20that%20he%20knocked%20the%20dog%20unconscious%20and%20caused%20him%20to%20suffer%20a%20seizure.%20Noel%20has%20been%20arrested%20and%20charged%20with%20aggravated%20animal%20cruelty%2C%20bonded%20out%2C%20and%20fired%20from%20his%20job.%20The%20charge%20is%20already%20the%20right%20one.%20What%20matters%20now%20is%20that%20it%20is%20seen%20through.%0A%0AThis%20was%20not%20a%20moment%20of%20panic%20or%20a%20defensive%20reaction.%20Boomer%20is%20a%20small%2C%20elderly%20dog%20who%20posed%20no%20threat%20to%20anyone.%20Kicking%20an%20animal%20that%20size%20hard%20enough%20to%20render%20him%20unconscious%20and%20trigger%20a%20seizure%20is%20a%20deliberate%20act%20of%20violence%20against%20a%20defenseless%20victim%20%E2%80%94%20the%20excessive%20infliction%20of%20unnecessary%20pain%20and%20suffering%20that%20Fla.%20Stat.%20%C2%A7828.12(2)%20was%20written%20to%20punish.%20That%20Noel%20was%20working%20in%20a%20position%20of%20access%20and%20trust%20when%20he%20did%20it%20only%20deepens%20the%20seriousness.%0A%0AI'm%20asking%20your%20office%20to%3A%0A%0A1%3A%20Pursue%20the%20aggravated%20animal%20cruelty%20charge%20under%20Fla.%20Stat.%20%C2%A7828.12(2)%20to%20conviction%2C%20and%20reject%20any%20plea%20reduction%2C%20diversion%2C%20or%20dismissal%20that%20would%20drop%20it%20below%20a%20felony.%0A2%3A%20Preserve%20and%20authenticate%20all%20evidence%20%E2%80%94%20the%20arrest%20record%2C%20any%20video%20or%20witness%20statements%2C%20and%20the%20full%20veterinary%20record%20documenting%20that%20Boomer%20was%20knocked%20unconscious%20and%20suffered%20a%20seizure.%0A3%3A%20Seek%20a%20permanent%20prohibition%20on%20Richardson%20Noel%20owning%2C%20keeping%2C%20or%20living%20with%20any%20animal%2C%20as%20authorized%20under%20Ponce's%20Law.%0A4%3A%20Ensure%20that%20on%20conviction%20Noel%20is%20placed%20on%20the%20FDLE%20animal-cruelty%20offender%20registry%2C%20with%20no%20sealing%20or%20expungement%2C%20as%20Dexter's%20Law%20now%20requires.%0A%0ABoomer%20was%20attacked%20by%20a%20stranger%20who%20had%20no%20cause%20and%20no%20excuse%2C%20and%20he%20survived%20a%20blow%20that%20could%20have%20killed%20a%20dog%20his%20size.%20The%20arrest%20was%20the%20first%20step.%20I'm%20asking%20you%20to%20finish%20it%20%E2%80%94%20to%20prosecute%20Richardson%20Noel%20to%20the%20full%20extent%20the%20evidence%20and%20the%20law%20allow.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F14x_QbhSavKNUxfxMB92-lUQwPmDA-sgj%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
