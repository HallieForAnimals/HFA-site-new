    var MAILTO = "mailto:nicole.silveira@countyofmerced.com?subject=Request%20for%20vigorous%20prosecution%20in%20the%20animal%20cruelty%20investigation%20involving%20husky%20%E2%80%9CSweetie%E2%80%9D&body=To%20whom%20it%20may%20concern%2C%0A%0AI%20am%20writing%20as%20a%20concerned%20member%20of%20the%20community%20regarding%20the%20animal%20cruelty%20investigation%20involving%20the%20husky%20known%20as%20Sweetie%20and%20her%20homeless%20owner.%20Merced%20Police%20have%20taken%20Sweetie%20into%20protective%20custody%20and%20submitted%20the%20case%20to%20your%20office%20for%20review%20of%20potential%20animal%20cruelty%20charges%20under%20California%20Penal%20Code%20%C2%A7%20597%20and%20related%20provisions.%0A%0APublic%20reports%2C%20including%20coverage%20by%20ABC30%20Action%20News%2C%20document%20numerous%20complaints%20dating%20back%20to%20last%20year%2C%20witness%20accounts%20of%20the%20dog%20being%20dragged%20on%20hot%20pavement%20while%20the%20owner%20rode%20a%20bicycle%2C%20the%20SPCA%20president%20stating%20she%20personally%20saw%20the%20dog%20picked%20up%20by%20the%20neck%20and%20slammed%20to%20the%20ground%2C%20circulating%20photos%20showing%20visible%20ribs%20and%20a%20tight%20muzzle%2C%20and%20video%20of%20the%20dog%20yelping%20while%20being%20pulled%20by%20the%20collar.%20Police%20have%20acknowledged%20receiving%20countless%20complaints%20and%20spending%20weeks%20collecting%20and%20submitting%20evidence.%20Lt.%20Kalvin%20Haygood%20has%20been%20quoted%20stating%20it%20takes%20time%20to%20build%20these%20cases%20and%20that%20the%20department%20is%20%E2%80%9Choping%20someone%20out%20there%20has%20the%20evidence%20we%E2%80%99re%20looking%20for.%E2%80%9D%20With%20all%20due%20respect%2C%20it%E2%80%99s%20the%20police%20department%E2%80%99s%20job%20to%20investigate%20and%20canvas%20for%20CCTV%20footage%2C%20not%20to%20sit%20back%20and%20wait%20for%20someone%20else%20to%20do%20it%20for%20them.%0A%0AUnder%20Penal%20Code%20%C2%A7%20597.1%2C%20peace%20officers%20may%20seize%20animals%20when%20there%20are%20reasonable%20grounds%20to%20believe%20prompt%20action%20is%20required%20to%20protect%20the%20animal%E2%80%99s%20health%20or%20safety.%20Sweetie%20was%20examined%20by%20a%20veterinarian%20who%20reportedly%20found%20her%20in%20good%20enough%20health%20to%20return%20to%20the%20owner%20at%20one%20point%2C%20despite%20community%20observations%20of%20visible%20ribs%3B%20she%20was%20later%20taken%20into%20protective%20custody%20after%20additional%20reported%20incidents.%0A%0AI%20urge%20your%20office%20to%20carefully%20review%20all%20submitted%20evidence%2C%20witness%20statements%2C%20photos%2C%20and%20video%2C%20and%20to%20file%20and%20pursue%20the%20strongest%20appropriate%20charges%20consistent%20with%20the%20facts%20and%20the%20law.%20Too%20often%2C%20animal%20cruelty%20cases%20are%20reduced%20or%20not%20pursued%20to%20the%20fullest%20extent%3B%20a%20strong%20response%20here%20would%20help%20ensure%20accountability%2C%20protect%20this%20animal%20from%20further%20harm%2C%20and%20send%20a%20clear%20message%20that%20neglect%20and%20abuse%20of%20animals%20will%20not%20be%20tolerated%20in%20Merced%20County.%20Please%20also%20seek%20appropriate%20orders%20regarding%20forfeiture%20of%20the%20animal%20and%20any%20restrictions%20on%20future%20animal%20ownership%20if%20a%20conviction%20results.%0A%0AThank%20you%20for%20your%20attention%20to%20this%20matter%20and%20for%20the%20work%20your%20office%20does%20on%20behalf%20of%20victims%2C%20including%20animals%20who%20cannot%20speak%20for%20themselves.%20I%20and%20many%20others%20in%20the%20community%20are%20watching%20this%20case%20closely%20and%20stand%20ready%20to%20support%20a%20thorough%2C%20justice-oriented%20resolution.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1RX4BS_TTjigOEBVmXtfr9coKwn4Whyur%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
