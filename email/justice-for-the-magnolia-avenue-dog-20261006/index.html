%20overwritten.%0A4.%20Identify%20the%20dog's%20owner%20through%20microchip%20and%20licensing%20records.%0A5.%20Refer%20the%20case%20to%20the%20District%20Attorney's%20Office%20for%20felony%20prosecution%20once%20a%20suspect%20is%20identified%2C%20with%20no%20reduction%20to%20a%20misdemeanor.%0A6.%20Issue%20a%20public%20statement%20with%20a%20tip%20line%20so%20residents%20with%20information%20can%20come%20forward.%0A7.%20Supervisor%20Hahn%3A%20establish%20a%20County%20reward%20for%20information%20leading%20to%20the%20arrest%20and%20conviction%20of%20the%20person%20responsible.%0A8.%20Release%20the%20findings%20publicly%20when%20the%20investigation%20concludes%2C%20and%20send%20updates%20on%20this%20case%20to%20contact%40hallieforanimals.org.%0A%0ASomeone%20in%20Lynwood%20hanged%20a%20dog%20with%20his%20own%20leash.%20That%20person%20needs%20to%20be%20found.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1AymScmi_geBCBsmj0i2QqA-hULSHV8v9%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
