e%20recordings.%0A%0AI%20demand%20that%20the%20North%20Carolina%20State%20Highway%20Patrol%3A%0A%0A1.%20Conduct%20a%20full%20Professional%20Standards%20review%20of%20this%20shooting%20as%20a%20use-of-force%20incident%2C%20including%20the%20number%20of%20rounds%20fired%2C%20the%20direction%20of%20travel%20of%20each%20dog%20when%20shot%2C%20and%20whether%20the%20trooper's%20entry%20onto%20the%20property%20provoked%20the%20encounter.%0A2.%20Explain%20publicly%20why%20no%20body-worn%20camera%20footage%20of%20the%20shooting%20exists%2C%20and%20preserve%20all%20recordings%2C%20device%20logs%20and%20evidence%20from%20the%20scene.%0A3.%20Investigate%20the%20handling%20of%20physical%20evidence%20at%20the%20scene%2C%20including%20the%20collection%20of%20shell%20casings%2C%20and%20refer%20any%20evidence-handling%20misconduct%20for%20criminal%20review.%0A4.%20Support%20the%20full%2C%20court-authorized%20public%20release%20of%20all%20recordings%20of%20the%20incident.%0A5.%20Publish%20the%20Patrol's%20policy%20governing%20the%20use%20of%20lethal%20force%20against%20animals%2C%20and%20require%20canine-encounter%20and%20non-lethal%20response%20training%20for%20all%20troopers.%0A6.%20Issue%20a%20public%20statement%20on%20this%20incident%20and%20release%20the%20findings%20of%20any%20review%20in%20full%2C%20with%20updates%20sent%20to%20contact%40hallieforanimals.org%0A%0ABonnie%20and%20Clyde%20were%20shot%20on%20their%20own%20property%20while%20helping%20their%20owner%20detain%20a%20suspect.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1TY3TOPwzqXisfO4H9E7LV1G9shzHc_DN%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
