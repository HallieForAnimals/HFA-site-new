0of%20what%20the%20Chinese%20public%20has%20already%20made%20clear%20it%20wants.%20In%20a%202025%20survey%20published%20by%20the%20Ministry%20of%20Justice%2C%2096%25%20of%20respondents%20supported%20a%20national%20anti-cruelty%20law.%20In%20January%202026%2C%20Chinese%20legal%20scholars%2C%20lawyers%20and%20campaigners%20convened%20the%20Beijing%20Animal%20Law%20Forum%20and%20submitted%20a%20formal%20appeal%20to%20the%20National%20People's%20Congress%20calling%20for%20exactly%20this%20reform.%20The%20people%20of%20the%20People's%20Republic%20have%20spoken%20with%20a%20clear%20voice%3B%20I%20am%20simply%20adding%20mine%20in%20support%20of%20theirs.%0A%0AChina%20has%20already%20laid%20the%20groundwork%20%E2%80%94%20standards%20for%20laboratory%20animals%2C%20wildlife%20protection%2C%20and%20the%20strengthened%20pet-related%20penalties%20introduced%20under%20the%20revised%20Law%20on%20Penalties%20for%20the%20Administration%20of%20Public%20Security%20that%20took%20effect%20on%201%20January%202026.%20A%20dedicated%20national%20law%20would%20build%20on%20these%20foundations%20by%20establishing%20clear%20protections%20against%20unnecessary%20cruelty%20across%20all%20contexts%3A%20farm%20animals%2C%20companion%20animals%2C%20and%20others.%0A%0ASuch%20legislation%20would%3A%0A%0A1.%20Support%20sustainable%20and%20high-quality%20agricultural%20development%0A2.%20Enhance%20public%20health%20and%20food%20safety%0A3.%20Strengthen%20China's%20international%20standing%20as%20a%20compassionate%20and%20forward-looking%20nation%0A4.%20Honour%20the%20will%20of%20the%20Chinese%20public%20and%20the%20traditional%20values%20of%20harmony%20and%20care%20between%20people%20and%20animals%0A%0AThe%20first%20expert%20draft%20of%20such%20a%20law%20was%20produced%20in%202009.%20Sixteen%20years%20on%2C%20with%20public%20support%20this%20overwhelming%2C%20I%20respectfully%20urge%20that%20the%20matter%20be%20prioritised%20on%20the%20legislative%20agenda%2C%20with%20input%20from%20the%20Ministry%20o 0public%20has%20already%20made%20clear%20it%20wants.%20In%20a%202025%20survey%20published%20by%20the%20Ministry%20of%20Justice%2C%2096%25%20of%20respondents%20supported%20a%20national%20anti-cruelty%20law.%20In%20January%202026%2C%20Chinese%20legal%20scholars%2C%20lawyers%20and%20campaigners%20convened%20the%20Beijing%20Animal%20Law%20Forum%20and%20submitted%20a%20formal%20appeal%20to%20the%20National%20People's%20Congress%20calling%20for%20exactly%20this%20reform.%20The%20people%20of%20the%20People's%20Republic%20have%20spoken%20with%20a%20clear%20voice%3B%20I%20am%20simply%20adding%20mine%20in%20support%20of%20theirs.%0A%0AChina%20has%20already%20laid%20the%20groundwork%20%E2%80%94%20standards%20for%20laboratory%20animals%2C%20wildlife%20protection%2C%20and%20the%20strengthened%20pet-related%20penalties%20introduced%20under%20the%20revised%20Law%20on%20Penalties%20for%20the%20Administration%20of%20Public%20Security%20that%20took%20effect%20on%201%20January%202026.%20A%20dedicated%20national%20law%20would%20build%20on%20these%20foundations%20by%20establishing%20clear%20protections%20against%20unnecessary%20cruelty%20across%20all%20contexts%3A%20farm%20animals%2C%20companion%20animals%2C%20and%20others.%0A%0ASuch%20legislation%20would%3A%0A%0A1.%20Support%20sustainable%20and%20high-quality%20agricultural%20development%0A2.%20Enhance%20public%20health%20and%20food%20safety%0A3.%20Strengthen%20China's%20international%20standing%20as%20a%20compassionate%20and%20forward-looking%20nation%0A4.%20Honour%20the%20will%20of%20the%20Chinese%20public%20and%20the%20traditional%20values%20of%20harmony%20and%20care%20between%20people%20and%20animals%0A%0AThe%20first%20expert%20draft%20of%20such%20a%20law%20was%20produced%20in%202009.%20Sixteen%20years%20on%2C%20with%20public%20support%20this%20overwhelming%2C%20I%20respectfully%20urge%20that%20the%20matter%20be%20prioritised%20on%20the%20legislative%20agenda%2C%20with%20input%20from%20the%20Ministry%20of%20Agriculture%20and%20Rural%20Affairs.%20This%20reform%20would%20enjoy%20broad%20public%20support%20and%20represent%20a%20significant%20advancement%20for%20China.%0A%0AThank%20you%20for%20your%20time%20and%20consideration.%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
