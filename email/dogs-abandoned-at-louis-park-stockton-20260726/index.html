left%20half-addressed.%20Every%20day%20these%20animals%20remain%2C%20the%20City%20is%20choosing%20not%20to%20act%20on%20authority%20it%20already%20holds%20and%20has%20already%20exercised%20at%20this%20exact%20location.%0A%0AWe%20are%20not%20asking%20the%20Council%20to%20collect%20animals.%20We%20are%20asking%20the%20Council%20to%20account%20for%20why%20its%20own%20agency%20did%20not%2C%20and%20to%20direct%20that%20the%20job%20be%20finished.%0A%0AWe%20demand%3A%0A%0A1%3A%20That%20Animal%20Services%20return%20to%20Louis%20Park%20and%20collect%20the%20three%20remaining%20huskies%20without%20further%20delay.%0A2%3A%20That%20their%20recovery%20be%20logged%20against%20the%20same%20incident%20as%20the%20injured%20husky%20already%20taken%2C%20so%20the%20full%20scope%20of%20this%20abandonment%20appears%20as%20one%20record.%0A3%3A%20That%20the%20City%20state%20publicly%20why%20three%20abandoned%20animals%20were%20left%20on%20public%20park%20land%20after%20officers%20were%20on%20scene%20and%20had%20already%20removed%20a%20fourth.%0A4%3A%20That%20the%20disposition%20of%20all%20four%20animals%2C%20the%20injured%20dog%20and%20the%20three%20left%20behind%20%E2%80%94%20be%20released%20publicly.%0A5%3A%20That%20the%20City%20confirm%20what%20steps%20it%20will%20take%20so%20that%20officers%20responding%20to%20multiple%20abandoned%20animals%20at%20one%20location%20do%20not%20leave%20any%20behind.%0A%0AOfficers%20have%20already%20been%20to%20Louis%20Park.%20They%20have%20already%20recovered%20one%20animal%20from%20it.%20Three%20are%20still%20there.%20Finish%20it.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1_pLT1I-P3_b1eYpVaFfLfmDxtFc5u6QZ%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org https://lnk.bio/hallieforanimals https://lnk.bio/hallieforanimals (same as return) "mailto:christina.fugazi@stocktonca.gov,michele.padilla@stocktonca.gov,mariela.ponce@stocktonca.gov,michael.blower@stocktonca.gov,m     var MAILTO = "mailto:christina.fugazi@stocktonca.gov,michele.padilla@stocktonca.gov,mariela.ponce@stocktonca.gov,michael.blower@stocktonca.gov,mario.enriquez@stocktonca.gov,brando.villapudua@stocktonca.gov,jason.lee@stocktonca.gov,johnny.ford@stocktonca.gov,lori.asuncion@stocktonca.gov,stanley.mcfadden@stocktonca.gov,ashley.kluza@stocktonca.gov,animalservices@stocktonca.gov?subject=Dogs%20Abandoned%20at%20Louis%20Park%2C%20Stockton&body=To%20whom%20it%20may%20concern%2C%0A%0ACity%20of%20Stockton%20officers%20recovered%20one%20injured%20Siberian%20husky%20from%20Louis%20Park%2C%20near%20the%20Pixie%20Woods%20service%20entrance%20at%203121%20Monte%20Diablo%20Ave.%20Your%20Animal%20Services%20records%20show%20when%20that%20recovery%20occurred.%20Three%20more%20huskies%20were%20abandoned%20at%20the%20same%20location%20and%20left%20behind.%20They%20remain%20on%20public%20park%20land%2C%20with%20no%20owner%20present%20and%20no%20one%20providing%20them%20food%2C%20water%2C%20or%20shade.%0A%0AThis%20is%20not%20a%20case%20with%20a%20missing%20address%2C%20an%20uncertain%20jurisdiction%2C%20or%20an%20access%20barrier.%20The%20location%20is%20City%20park%20land.%20Stockton%20Animal%20Services%20operates%20under%20the%20Police%20Department%2C%20and%20officers%20were%20physically%20on%20this%20site%20when%20the%20injured%20animal%20was%20taken.%20Under%20California%20Penal%20Code%20%C2%A7%20597.1%2C%20a%20peace%20officer%20with%20reasonable%20grounds%20to%20believe%20an%20animal%20is%20without%20proper%20care%20may%20take%20custody%20of%20that%20animal%20without%20a%20prior%20warrant.%20That%20authority%20applied%20to%20all%20four%20huskies%20at%20the%20moment%20officers%20arrived.%20Three%20were%20left%20anyway.%0A%0AThere%20is%20no%20lawful%20obstacle%20to%20collecting%20the%20remaining%20three%2C%20and%20there%20was%20none%20when%20officers%20first%20attended.%20What%20happened%20instead%20is%20that%20a%20documented%2C%20in-progress%20abandonment%20on%20public%20land%20was%20left%20half-addressed.%20Every%20day%20these%20animals%20remain%2C%20the%20City%20is%20choosing%20not%20to%20act%20on%20authority%20it%20already%20holds%20and%20has%20already%20exercised%20at%20this%20exact%20location.%0A%0AWe%20are%20not%20asking%20the%20Council%20to%20collect%20animals.%20We%20are%20asking%20the%20Council%20to%20account%20for%20why%20its%20own%20agency%20did%20not%2C%20and%20to%20direct%20that%20the%20job%20be%20finished.%0A%0AWe%20demand%3A%0A%0A1%3A%20That%20Animal%20Services%20return%20to%20Louis%20Park%20and%20collect%20the%20three%20remaining%20huskies%20without%20further%20delay.%0A2%3A%20That%20their%20recovery%20be%20logged%20against%20the%20same%20incident%20as%20the%20injured%20husky%20already%20taken%2C%20so%20the%20full%20scope%20of%20this%20abandonment%20appears%20as%20one%20record.%0A3%3A%20That%20the%20City%20state%20publicly%20why%20three%20abandoned%20animals%20were%20left%20on%20public%20park%20land%20after%20officers%20were%20on%20scene%20and%20had%20already%20removed%20a%20fourth.%0A4%3A%20That%20the%20disposition%20of%20all%20four%20animals%2C%20the%20injured%20dog%20and%20the%20three%20left%20behind%20%E2%80%94%20be%20released%20publicly.%0A5%3A%20That%20the%20City%20confirm%20what%20steps%20it%20will%20take%20so%20that%20officers%20responding%20to%20multiple%20abandoned%20animals%20at%20one%20location%20do%20not%20leave%20any%20behind.%0A%0AOfficers%20have%20already%20been%20to%20Louis%20Park.%20They%20have%20already%20recovered%20one%20animal%20from%20it.%20Three%20are%20still%20there.%20Finish%20it.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1_pLT1I-P3_b1eYpVaFfLfmDxtFc5u6QZ%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
</body>
</html>
