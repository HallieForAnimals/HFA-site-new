    var MAILTO = "mailto:amadeo.oktrova@nypd.org,dinowitz@council.nyc.gov?subject=Justice%20For%20Mia%20Glass's%20Animals&body=To%20whom%20it%20may%20concern%2C%0A%0AA%20cat%20and%20a%20dog%20are%20being%20kept%20in%20stacked%20crates%20inside%20Mia%20Glass's%20unit%20at%205480%20Broadway%2C%20Unit%204K.%20Neither%20animal%20has%20room%20to%20exercise%2C%20and%20both%20are%20believed%20to%20be%20confined%20to%20the%20crates%2024%20hours%20a%20day.%20The%20crate%20is%20undersized%20even%20for%20the%20cat%2C%20and%20the%20larger%20dog%20is%20at%20times%20shut%20in%20that%20same%20crate.%20The%20resident%20is%20reported%20to%20be%20a%20vulnerable%20adult%20who%20may%20be%20unable%20to%20provide%20adequate%20care.%20The%20precinct%20attended%20once%20already%2C%20311%20case%20311-28823955%2C%20now%20closed%20as%20%22no%20violation%22%2C%20but%20a%20doorstep%20visit%20that%20confirms%20food%20and%20water%20are%20present%20is%20not%20a%20welfare%20assessment%2C%20and%20it%20does%20not%20rule%20out%20the%20harm%20that%20continuous%20crate%20confinement%20causes%20over%20time.%0A%0AThis%20is%20not%20a%20call%20to%20punish%20anyone.%20It%20is%20a%20call%20to%20get%20two%20animals%20properly%20assessed%20and%2C%20if%20they%20are%20suffering%2C%20moved%20to%20safety%2C%20and%20to%20get%20the%20resident%20connected%20to%20support%20rather%20than%20left%20in%20a%20situation%20no%20one%20can%20sustain.%0A%0AThe%2050th%20Precinct%20must%3A%0A%0A1%3A%20Reopen%20311%20case%20311-28823955%20and%20conduct%20a%20proper%20welfare%20assessment%20at%205480%20Broadway%2C%20Unit%204K%2C%20through%20the%20precinct's%20ASPCA%20Liaison%20Officer%2C%20with%20ASPCA%20veterinary%20input%2C%20rather%20than%20a%20repeat%20doorstep%20visit.%0A2%3A%20Evaluate%20the%20effects%20of%20prolonged%20confinement%20specifically%3A%20the%20crate%20is%20undersized%20even%20for%20the%20cat%2C%20and%20the%20larger%20dog%20is%20at%20times%20confined%20in%20that%20same%20crate%2C%20assess%20whether%20each%20animal%20can%20stand%20fully%2C%20turn%2C%20and%20lie%20outstretched%3B%20body%20condition%20and%20muscle%20and%20joint%20health%3B%20sanitation%2C%20given%20that%20stacked%20crates%20expose%20the%20lower%20animal%20to%20waste%20from%20above%3B%20and%20signs%20of%20psychological%20distress%2C%20the%20grounds%20for%20neglect%20under%20New%20York%20Agriculture%20and%20Markets%20Law%20%C2%A7%20353.%0A3%3A%20Engage%20the%20ASPCA's%20Community%20Engagement%2FCruelty%20Intervention%20Advocacy%20team%2C%20which%20exists%20for%20exactly%20this%20situation%2C%20to%20secure%20the%20surrender%20and%20rehoming%20of%20the%20animals%20where%20appropriate.%0A4%3A%20Make%20a%20parallel%20referral%20to%20Adult%20Protective%20Services%20for%20a%20welfare%20check%20on%20the%20resident%20herself.%0A5%3A%20Provide%20the%20outcome%20of%20the%20reassessment%2C%20the%20status%20of%20both%20animals%20and%20any%20intervention%20made%2C%20to%20the%20email%20provided%20below%2C%20which%20is%20coordinating%20follow-up%20on%20this%20case.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F10cBvsXgBBZn80MR0IwSmJ2tXOizcgokI%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
</body>
</html>
