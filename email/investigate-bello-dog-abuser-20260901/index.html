%20de%20Polic%C3%ADa%20y%20la%20Fiscal%C3%ADa%20para%20que%20esto%20deje%20de%20ser%20un%20juego%20de%20pases%20entre%20oficinas%2C%20y%20asignarle%20a%20la%20denunciante%20un%20n%C3%BAmero%20de%20caso%20que%20le%20permita%20dar%20seguimiento.%0A5%3A%20Hacer%20p%C3%BAblico%20el%20resultado%20de%20la%20inspecci%C3%B3n%20y%20cualquier%20acci%C3%B3n%20que%20se%20derive%20de%20ella.%0A%0ANing%C3%BAn%20animal%20deber%C3%ADa%20vivir%20con%20miedo.%20Por%20favor%2C%20traten%20este%20asunto%20con%20la%20urgencia%20que%20merece.%0A%0APrueba%20en%20video%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1eueOz79Ve5jyRS8UR5ckh-Jbq3x5z__B%2Fview%3Fusp%3Dsharing%0A%0AAtentamente%2C%0A%0A%0A%0AEquipo%20de%20%40HallieForAnimals%0Acontact%40hallieforanimals.org%0A%0A%0A%0A%0A%0ATo%20whom%20it%20may%20concern%2C%0A%0AI%20am%20writing%20about%20two%20dogs%2C%20a%20husky%20and%20a%20pitbull%2C%20kept%20in%20a%20residence%20at%20Parque%20Residencial%20Paisajes%2C%20Etapa%201%2C%20Torre%202%2C%20Apartamento%201310%2C%20Bello%2C%20Antioquia.%20For%20roughly%20five%20months%20a%20neighbor%20has%20repeatedly%20reported%20hearing%20heavy%20blows%2C%20objects%20being%20dragged%2C%20and%20one%20of%20the%20dogs%20being%20beaten.%20She%20has%20called%20the%20police%20more%20than%20eight%20times%20and%20contacted%20environmental%20management%20and%20the%20building%20administration%2C%20with%20no%20effective%20response.%0A%0AI%20am%20asking%20the%20authorities%20of%20Bello%20to%20act%3A%0A%0A1%3A%20Carry%20out%20an%20in-person%20welfare%20inspection%20of%20both%20dogs%20and%20their%20living%20conditions%20at%20this%20address%20without%20delay.%0A2%3A%20Apply%20the%20corrective%20measures%20available%20under%20Law%201801%20of%202016%2C%20and%20exercise%20preventive%20seizure%2C%20which%20Law%201774%20of%202016%20permits%20without%20a%20prior%20court%20order.%0A3%3A%20Refer%20the%20case%20to%20the%20Fiscal%C3%ADa%20General%20de%20la%20Naci%C3%B3n%20(GELMA)%20for%20criminal%20investigation%20under%20Article%20339A%20of%20the%20Penal%20Code%2C%20given%20that%20repeated%20beating%20can%20cause%20the%20serious%20harm%20that%20statute%20punishes.%0A4%3A%20Coordinate%20the%20response%20across%20the%20police%2C%20the%20Inspecci%C3%B3n%20de%20Polic%C3%ADa%2C%20and%20the%20Fiscal%C3%ADa%20so%20this%20stops%20being%20passed%20between%20offices%2C%20and%20issue%20the%20complainant%20a%20case%20number%20she%20can%20track.%0A5%3A%20Make%20the%20outcome%20of%20the%20inspection%20and%20any%20resulting%20action%20public.%0A%0ANo%20animal%20should%20live%20in%20fear.%20Please%20treat%20this%20as%20the%20urgent%20matter%20it%20is.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1eueOz79Ve5jyRS8UR5ckh-Jbq3x5z__B%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org" rel="nofollow">Open email</a>
