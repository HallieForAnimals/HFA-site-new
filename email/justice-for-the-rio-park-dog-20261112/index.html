    var MAILTO = "mailto:John.Cowen@brownsvilletx.gov,Pedro.Cardenas@brownsvilletx.gov?subject=Dog%20Tethered%20by%20a%20Cord%20to%20a%20Trailer%20Hitch%20at%20Rio%20Mobile%20Home%20Park%2C%208801%20Boca%20Chica%20Blvd&body=To%20whom%20it%20may%20concern%2C%0A%0AI%20am%20writing%20to%20report%20a%20dog%20kept%20tethered%20at%20Rio%20Mobile%20Home%20%26%20RV%20Park%2C%208801%20Boca%20Chica%20Blvd%2C%20Brownsville%2C%20TX%2078521.%20Photographs%20show%20him%20restrained%20by%20a%20thin%20white%20cord%20tied%20to%20a%20trailer%20hitch%20beside%20a%20propane%20cylinder%2C%20with%20the%20cord%20wrapped%20and%20tangled%20around%20the%20hitch%20jack.%0A%0AResidents%20report%20that%20he%20is%20left%20outside%20unattended%20from%20morning%20until%20night%2C%20with%20no%20food%20and%20no%20water%20other%20than%20rain.%20They%20report%20having%20made%20multiple%20complaints%20to%20Animal%20Control%20without%20any%20lasting%20action.%20After%20complaints%2C%20the%20owner%20brings%20the%20dog%20inside%2C%20then%20puts%20him%20back%20out%20on%20the%20tether%20days%20later.%0A%0AThis%20restraint%20violates%20Brownsville%20Code%20of%20Ordinances%20%C2%A710-1061(b).%20That%20section%20requires%20any%20restraint%20to%20be%20designed%20and%20placed%20to%20prevent%20choking%20or%20strangulation%2C%20to%20be%20attached%20to%20a%20properly%20fitted%20collar%2C%20to%20be%20no%20less%20than%20ten%20feet%20long%2C%20and%20to%20be%20on%20a%20swivel%20or%20chain%20run.%20Section%2010-1061(a)%20requires%20good%20wholesome%20food%20and%20water%20and%20proper%20shelter.%0A%0ABecause%20the%20dog%20is%20left%20outside%20and%20unattended%2C%20Texas%20Health%20and%20Safety%20Code%20%C2%A7821.102%20applies%20in%20full.%20It%20requires%20access%20to%20adequate%20shelter%2C%20shade%2C%20potable%20water%2C%20and%20dry%20ground.%20It%20prohibits%20any%20restraint%20shorter%20than%20the%20greater%20of%20ten%20feet%20or%20five%20times%20the%20dog%E2%80%99s%20length%2C%20and%20any%20restraint%20attached%20to%20a%20collar%20that%20is%20not%20properly%20fitted.%20A%20residential%20mobile%20home%20park%20is%20not%20a%20public%20camping%20area%2C%20so%20no%20exception%20under%20%C2%A7821.103%20applies.%0A%0ADepriving%20a%20dog%20of%20food%20and%20water%20also%20falls%20under%20Penal%20Code%20%C2%A742.092.%0A%0AI%20demand%3A%0A%0A1%3A%20An%20immediate%20welfare%20inspection%20of%20this%20dog%20by%20Brownsville%20Animal%20Regulation%20and%20Care.%0A2%3A%20Full%20documentation%20of%20the%20restraint%2C%20its%20length%2C%20the%20collar%20fit%2C%20and%20his%20access%20to%20food%2C%20water%2C%20shelter%2C%20and%20shade.%0A3%3A%20Citations%20under%20Brownsville%20Code%20%C2%A710-1061%20and%20Health%20and%20Safety%20Code%20%C2%A7821.102%20for%20every%20violation%20found.%0A4%3A%20Referral%20under%20Penal%20Code%20%C2%A742.092%20and%20a%20seizure%20warrant%20under%20Health%20and%20Safety%20Code%20Chapter%20821%2C%20Subchapter%20B.%0A5%3A%20Unannounced%20follow-up%20inspections%20on%20a%20continuing%20basis%2C%20since%20temporary%20compliance%20after%20complaints%20has%20already%20been%20reported.%0A6%3A%20A%20review%20of%20every%20prior%20complaint%20on%20this%20address%20and%20why%20none%20resulted%20in%20enforcement.%0A7%3A%20A%20public%20statement%20on%20the%20City%E2%80%99s%20response%20to%20this%20case.%0A8%3A%20Full%20transparency%2C%20with%20inspection%20findings%2C%20the%20complaint%20history%2C%20and%20enforcement%20actions%20released%20publicly.%0A9%3A%20Updates%20on%20this%20case%20sent%20to%20contact%40hallieforanimals.org.%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
