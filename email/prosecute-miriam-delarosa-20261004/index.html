    var MAILTO = "mailto:KathleenHoague@MiamiSAO.com?subject=Prosecute%20all%20three%20felony%20counts%3A%20State%20v.%20Miriam%20Yilian%20Delarosa&body=To%20whom%20it%20may%20concern%2C%0A%0AI%20am%20writing%20about%20the%20case%20against%20Miriam%20Yilian%20Delarosa%2C%2042.%20Hialeah%20Police%20arrested%20her%20on%20October%201%2C%202026%2C%20and%20she%20is%20charged%20with%20three%20counts%20of%20felony%20animal%20cruelty%20with%20intent%20to%20injure%20or%20kill.%20At%20her%20first%20appearance%20on%20October%202%2C%20Judge%20Mindy%20Glazer%20found%20probable%20cause.%0A%0AAccording%20to%20the%20Hialeah%20Police%20arrest%20report%2C%20surveillance%20video%20at%20the%20Metro%20Parc%20Apartments%2C%20952%20E.%2026th%20St.%2C%20captured%20three%20separate%20incidents%20involving%20the%20same%20small%20dog%20she%20was%20fostering.%20On%20September%2016%2C%20after%20the%20dog%20slipped%20out%20of%20the%20collar%2C%20she%20allegedly%20grabbed%20the%20dog%2C%20carried%20the%20dog%20by%20the%20neck%2C%20and%20held%20the%20dog%20upside%20down%20by%20the%20legs.%20Minutes%20later%2C%20she%20allegedly%20struck%20the%20dog%20in%20the%20face%20about%20eight%20times.%20Later%20that%20night%2C%20in%20the%20building's%20elevator%2C%20she%20allegedly%20held%20the%20dog%20by%20a%20front%20leg%20and%20hit%20the%20dog%20about%20ten%20more%20times.%20The%20dog%20urinated%20and%20defecated%20during%20the%20assault.%0A%0ADetectives%20learned%20that%20this%20dog%20had%20already%20been%20abused%20before%20being%20placed%20with%20her.%20The%20dog%20went%20into%20foster%20care%20to%20be%20protected%20and%20was%20instead%20beaten%20repeatedly%20on%20camera.%0A%0AEach%20count%20is%20a%20third-degree%20felony%20under%20Florida%20Statute%20%C2%A7%20828.12(2)%2C%20carrying%20up%20to%20five%20years%20in%20prison%20and%20a%20%2410%2C000%20fine.%20The%20footage%20documents%20a%20pattern%20of%20abuse%2C%20not%20a%20single%20lapse.%0A%0AI%20am%20asking%20the%20State%20Attorney's%20Office%20to%3A%0A%0A1%3A%20Prosecute%20all%20three%20felony%20counts%20as%20filed%2C%20with%20no%20reduction%20to%20misdemeanor%20charges%20and%20no%20pretrial%20diversion.%0A2%3A%20Evaluate%20the%20case%20for%20the%20aggravated%20animal%20cruelty%20sentencing%20multiplier%20under%20Dexter's%20Law%2C%20which%20multiplies%20sentencing%20points%20by%201.25.%20The%20footage%20shows%20repeated%20strikes%20to%20the%20dog's%20face%20across%20separate%20incidents%20and%20the%20dog%203%3A%20being%20held%20upside%20down%20by%20the%20legs.%0A4%3A%20Seek%2C%20as%20a%20condition%20of%20any%20sentence%20or%20plea%2C%20a%20permanent%20prohibition%20on%20owning%2C%20possessing%2C%20fostering%2C%20or%20caring%20for%20animals.%0A5%3A%20Ensure%20that%20none%20of%20the%20three%20dogs%20now%20held%20by%20Miami-Dade%20Animal%20Services%20is%20returned%20to%20her.%0A6%3A%20Reject%20any%20resolution%20that%20would%20keep%20her%20off%20the%20Florida%20Department%20of%20Law%20Enforcement's%20statewide%20animal%20abuser%20registry%20under%20Dexter's%20Law.%20Pretrial%20diversion%20would%20allow%20her%20to%20foster%20and%20adopt%20again%20without%20appearing%20on%20it.%0A7%3A%20Establish%20which%20rescue%20or%20foster%20program%20placed%20the%20dog%20with%20her%2C%20so%20that%20no%20organization%20places%20animals%20in%20her%20care%20again.%0A8%3A%20Issue%20a%20public%20statement%20on%20the%20status%20of%20this%20case%20and%20send%20updates%20to%20contact%40hallieforanimals.org.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1p3kfLzDfXokc-je6R89Pr0ayHqtQw9lk%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
