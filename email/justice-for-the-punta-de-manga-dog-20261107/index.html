    var MAILTO = "mailto:inba@mgap.gub.uy?subject=Perro%20muerto%20a%20machetazos%20en%20Punta%20de%20Manga%2FDog%20killed%20with%20a%20machete%20in%20Punta%20de%20Manga&body=A%20quien%20corresponda%3A%0A%0AUn%20video%20grabado%20por%20una%20vecina%20muestra%20a%20un%20hombre%20en%20Punta%20de%20Manga%2C%20Montevideo%2C%20matando%20a%20un%20perro%20con%20un%20machete.%20En%20el%20mismo%20domicilio%20sigue%20viviendo%20otro%20perro.%20No%20es%20la%20primera%20denuncia%20sobre%20este%20domicilio.%20El%20INBA%20ya%20recibi%C3%B3%20una%20denuncia%20anterior%2C%20y%20de%20esta%20misma%20direcci%C3%B3n%20ya%20se%20rescat%C3%B3%20un%20perro%2C%20por%20lo%20que%20el%20domicilio%20ya%20consta%20en%20sus%20registros.%0A%0AExijo%20que%20el%20INBA%3A%0A%0A1%3A%20Inspeccione%20el%20domicilio%20de%20inmediato%20y%20retire%20al%20perro%20que%20queda.%0A2%3A%20Imponga%20la%20prohibici%C3%B3n%20definitiva%20de%20tenencia%20de%20animales%20a%20esta%20persona%20y%20aplique%20las%20sanciones%20m%C3%A1ximas%20previstas%20en%20la%20Ley%2018.471.%0A3%3A%20Denuncie%20el%20caso%20ante%20la%20Polic%C3%ADa%20y%20la%20Fiscal%C3%ADa%20por%20cualquier%20delito%20que%20corresponda.%0A4%3A%20Explique%20p%C3%BAblicamente%20por%20qu%C3%A9%20la%20denuncia%20anterior%20sobre%20este%20domicilio%20no%20evit%C3%B3%20esta%20muerte.%0A5%3A%20Emita%20un%20comunicado%20p%C3%BAblico%20sobre%20las%20medidas%20adoptadas%20y%20publique%20sus%20conclusiones.%0A6%3A%20Env%C3%ADe%20actualizaciones%20a%20contact%40hallieforanimals.org%0A%0APrueba%20en%20video%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1VUjgqMEDvh1B5HTKZKWiQZa06hvfRwtK%2Fview%3Fusp%3Dsharing%0A%0AAtentamente%2C%0A%0A%0A%0A%0ATo%20whom%20it%20may%20concern%2C%0A%0AVideo%20recorded%20by%20a%20neighbor%20shows%20a%20man%20in%20Punta%20de%20Manga%2C%20Montevideo%2C%20killing%20a%20dog%20with%20a%20machete.%20Another%20dog%20is%20still%20living%20at%20the%20same%20property.%20This%20is%20not%20the%20first%20report%20about%20this%20household.%20INBA%20already%20received%20a%20complaint%2C%20and%20a%20dog%20was%20previously%20rescued%20from%20this%20same%20address%2C%20so%20the%20location%20is%20already%20on%20file.%0A%0AI%20demand%20that%20INBA%3A%0A%0A1%3A%20Inspect%20the%20property%20immediately%20and%20remove%20the%20remaining%20dog.%0A2%3A%20Impose%20a%20permanent%20ban%20on%20this%20individual%20keeping%20animals%2C%20and%20apply%20the%20maximum%20sanctions%20available%20under%20Ley%2018.471.%0A3%3A%20Report%20the%20case%20to%20the%20police%20and%20the%20Fiscal%C3%ADa%20for%20any%20offense%20that%20applies.%0A4%3A%20Explain%20publicly%20why%20the%20earlier%20complaint%20about%20this%20household%20did%20not%20prevent%20this%20killing.%0A5%3A%20Issue%20a%20public%20statement%20on%20the%20actions%20taken%2C%20and%20release%20your%20findings.%0A6%3A%20Send%20updates%20to%20contact%40hallieforanimals.org%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1VUjgqMEDvh1B5HTKZKWiQZa06hvfRwtK%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
