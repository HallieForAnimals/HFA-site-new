ial%20term%20the%20law%20allows.%0A4.%20Oppose%20any%20argument%20for%20leniency%20based%20on%20Ms.%20Nguyen's%20age.%0A5.%20Seek%2C%20as%20a%20condition%20of%20her%20release%20now%20and%20as%20part%20of%20any%20sentence%2C%20the%20maximum%20prohibition%20on%20owning%2C%20caring%20for%2C%20or%20living%20with%20animals%2C%20and%20confirm%20the%20welfare%20of%20any%20animals%20currently%20in%20her%20household.%0A6.%20Issue%20a%20public%20statement%20as%20the%20case%20progresses%2C%20and%20send%20updates%20on%20this%20case%20to%20contact%40hallieforanimals.org.%0A%0ABlackey%20trusted%20the%20person%20who%20fed%20him%2C%20and%20she%20used%20that%20trust%20to%20kill%20him.%20The%20sentence%20should%20reflect%20it.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1TxaQb5G0Yp0UiI6saA3ZQyoG35WH2Wpk%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
