    var MAILTO = "mailto:proteccion.animal@nuevoleon.gob.mx,denuncia.ambiental@nuevoleon.gob.mx,bienestar.animal@nuevoleon.gob.mx,070@nuevoleon.gob.mx?subject=%C2%A1Justicia%20para%20el%20perro%20asesinado%20en%20Santa%20Mar%C3%ADa%2C%20Guadalupe!%2FJustice%20for%20the%20dog%20killed%20in%20Santa%20Mar%C3%ADa%2C%20Guadalupe&body=A%20quien%20corresponda%3A%0A%0AMe%20dirijo%20a%20ustedes%20respecto%20al%20perro%20asesinado%20en%20Calle%20Crisantemos%20%237105%2C%20Col.%20Santa%20Mar%C3%ADa%20Sector%20A%2C%20Guadalupe%2C%20N.L.%2C%20C.P.%2067198%2C%20encadenado%20como%20castigo%2C%20sin%20poder%20acostarse%20y%20dejado%20morir.%20Fuerza%20Civil%20y%20la%20Secretar%C3%ADa%20de%20Medio%20Ambiente%20ya%20acudieron%20al%20lugar%2C%20retiraron%20el%20cuerpo%20y%20sacaron%20a%20un%20segundo%20perro%20vivo.%20A%20pesar%20de%20esto%2C%20nadie%20ha%20sido%20detenido.%0A%0ASoy%20una%20de%20las%20muchas%20personas%20que%20exigimos%20que%20Nuevo%20Le%C3%B3n%20act%C3%BAe%3A%0A%0A1.%20Identificar%20y%20procesar%20a%20los%20responsables%20conforme%20a%20la%20ley%20estatal%20de%20maltrato%20animal.%20%20%0A2.%20Publicar%20el%20estatus%20de%20la%20investigaci%C3%B3n.%20%20%0A3.%20Confirmar%20que%20el%20perro%20sobreviviente%20se%20encuentra%20a%20salvo%20y%20bajo%20custodia%20adecuada.%0A%0AEl%20maltrato%20animal%20es%20un%20delito%20en%20Nuevo%20Le%C3%B3n.%20Este%20caso%20tiene%20testigos%2C%20una%20respuesta%20documentada%20del%20Estado%20y%20un%20domicilio%20conocido.%20No%20hay%20raz%C3%B3n%20para%20que%20se%20estanque.%0A%0AEvidencia%20en%20video%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1ZcONdG6ZbQulLvVBgRhixKE2vudh1yyP%2Fview%3Fusp%3Dsharing%0A%0AAtentamente%2C%20%20%0A%40HallieForAnimals%20Team%20%20%0Acontact%40hallieforanimals.org%0A%0A%0A%0ATo%20whom%20it%20may%20concern%2C%0A%0AI%20am%20writing%20about%20the%20dog%20killed%20at%20Calle%20Crisantemos%20%237105%2C%20Col.%20Santa%20Mar%C3%ADa%20Sector%20A%2C%20Guadalupe%2C%20N.L.%2C%20C.P.%2067198%2C%20chained%20as%20punishment%2C%20unable%20to%20lie%20down%2C%20and%20left%20to%20die.%20Fuerza%20Civil%20and%20the%20Secretar%C3%ADa%20de%20Medio%20Ambiente%20already%20attended%20the%20scene%2C%20removed%20the%20body%2C%20and%20removed%20a%20second%20living%20dog.%20Despite%20this%2C%20no%20one%20has%20been%20arrested.%0A%0AI%20am%20one%20of%20many%20people%20demanding%20that%20Nuevo%20Le%C3%B3n%20act%3A%0A%0A1%3A%20Identify%20and%20prosecute%20those%20responsible%20under%20the%20state's%20animal-cruelty%20law.%0A2%3A%20Publish%20the%20status%20of%20the%20investigation.%0A3%3A%20Confirm%20the%20surviving%20dog%20is%20safe%20and%20in%20proper%20custody.%0A%0AAnimal%20cruelty%20is%20a%20crime%20in%20Nuevo%20Le%C3%B3n.%20This%20case%20has%20witnesses%2C%20a%20documented%20state%20response%2C%20and%20a%20known%20address.%20There%20is%20no%20reason%20for%20it%20to%20stall.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1ZcONdG6ZbQulLvVBgRhixKE2vudh1yyP%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
