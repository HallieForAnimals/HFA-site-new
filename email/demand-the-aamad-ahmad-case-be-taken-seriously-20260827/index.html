    var MAILTO = "mailto:harpreet.uppal.mp@parliament.uk?subject=Labour%20calls%20itself%20the%20party%20of%20animal%20welfare&body=To%20whom%20it%20may%20concern%2C%0A%0AOn%2011%20August%2C%20West%20Yorkshire%20Police%20seized%20a%20seriously%20unwell%20Alsatian%20from%20a%20property%20on%20Market%20Street%2C%20in%20your%20constituency%2C%20after%20residents%20reported%20and%20filmed%20the%20dog%20being%20neglected%2C%20including%20that%20it%20had%20been%20left%20in%20a%20car%20during%20a%20heatwave.%20Its%20condition%20was%20so%20severe%20the%20dog%20had%20to%20be%20put%20to%20sleep.%20Aamad%20Ahmad%20has%20been%20charged%20with%20failing%20to%20prevent%20unnecessary%20suffering%20to%20an%20animal%20and%20is%20due%20before%20Kirklees%20Magistrates'%20Court%20on%202%20September.%0A%0AYour%20party%20promised%20better%20than%20this.%20Labour's%202024%20manifesto%20pledged%20%22stronger%20animal%20welfare%22%20and%20called%20Labour%20the%20only%20party%20that%20can%20be%20trusted%20on%20it.%20Last%20December%20your%20Government%20launched%20a%20five-year%20Animal%20Welfare%20Strategy%2C%20billed%20as%20the%20biggest%20boost%20to%20animal%20welfare%20in%20a%20generation.%20Yet%20that%20Strategy%20is%20silent%20on%20the%20failure%20this%20case%20exposes%3A%20cruelty%20like%20this%20routinely%20ends%20in%20a%20suspended%20sentence%2C%20a%20token%20fine%2C%20and%20a%20disqualification%20order%20that%20no%20one%20enforces%2C%20leaving%20offenders%20free%20to%20walk%20into%20a%20rescue%20and%20collect%20another%20animal%20on%20the%20way%20home%20from%20court.%20The%20law%20allows%20up%20to%20five%20years%2C%20an%20unlimited%20fine%2C%20and%20a%20lifetime%20ban.%20Those%20powers%20are%20barely%20used%2C%20and%20your%20Strategy%20does%20nothing%20to%20change%20that.%0A%0AYou%20are%20the%20MP%20for%20the%20town%20where%20this%20happened%2C%20and%20you%20sit%20on%20the%20Government%20benches%20that%20wrote%20that%20Strategy.%20When%20a%20young%20life%20was%20lost%20to%20knife%20crime%20here%2C%20you%20issued%20a%20call%20to%20action%20and%20took%20it%20straight%20to%20ministers.%20I%20am%20asking%20you%20to%20do%20the%20same%20now%3A%0A%0A1%3A%20Speak%20publicly%20to%20the%20strength%20of%20feeling%20this%20case%20has%20caused%2C%20and%20name%20the%20gap%20behind%20it%2C%20a%20Government%20that%20calls%20its%20own%20strategy%20world-leading%20while%20the%20cruelty%20already%20on%20the%20statute%20book%20goes%20under-punished.%0A2%3A%20Press%20for%20a%20mandatory%2C%20enforced%20national%20register%20of%20people%20disqualified%20from%20keeping%20animals%2C%20written%20into%20the%20Animal%20Welfare%20Strategy%2C%20so%20that%20a%20ban%20actually%20means%20something.%0A3%3A%20Support%20bringing%20animal%20cruelty%20within%20the%20Unduly%20Lenient%20Sentence%20scheme%2C%20so%20that%20sentences%20which%20fail%20the%20animal%20can%20be%20challenged%20in%20the%20Court%20of%20Appeal.%0A4%3A%20Ask%20ministers%20directly%20why%20the%20five-year%20maximum%20introduced%20in%202021%20is%20so%20rarely%20used%20for%20offenses%20against%20pets%2C%20and%20what%20your%20Government%20will%20do%20to%20close%20the%20gap%20between%20the%20law%20and%20the%20sentences%20handed%20down.%0A%0AYour%20party%20promised%20the%20biggest%20boost%20to%20animal%20welfare%20in%20a%20generation.%20Prove%20it%20here%2C%20on%20your%20own%20doorstep.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1YLrRjEJ0ZBNxXFbheljC7mZYGNiQTyuI%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
