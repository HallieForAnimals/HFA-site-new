%0ADemands%3A%0A%0A1%3A%20Seize%20Sweety%20immediately%20under%20Penal%20Code%20%C2%A7%20597.1.%0A2%3A%20Perform%20a%20veterinary%20body-condition%20assessment%20on%20intake%20and%20preserve%20it%20as%20evidence.%0A3%3A%20Obtain%20and%20review%20CCTV%20from%20the%20adjacent%20Taco%20Bell%20for%20the%20relevant%20period%3B%20allegations%20of%20sexual%20abuse%20of%20the%20animal%20have%20been%20raised%20and%20must%20be%20investigated.%0A4%3A%20Publicly%20account%20for%20why%20repeated%20prior%20reports%20on%20this%20animal%20went%20unactioned.%0A5%3A%20Release%20the%20outcome%20of%20this%20intervention%20publicly.%0A%0AOfficers%20should%20be%20aware%20the%20owner%20is%20reported%20to%20be%20armed%20and%20possibly%20in%20mental%20health%20crisis%3B%20plan%20the%20approach%20accordingly%2C%20with%20crisis%20support%20if%20available.%20The%20public%20has%20been%20instructed%20not%20to%20approach.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1S8kxVqpCku_hMbU5X91wl0u0aqilT3lv%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
