%0A2%3A%20If%20access%20is%20refused%20or%20the%20dog%20is%20hidden%2C%20obtain%20and%20execute%20a%20seizure%20warrant%20under%20Ch.%20821%2C%20Subchapter%20B%20through%20the%20justice%20court%20and%20remove%20the%20dog.%0A3%3A%20Have%20CCPD%20assess%20the%20conditions%20under%20Penal%20Code%20%C2%A7%2042.092%20and%20pursue%20charges%20if%20the%20threshold%20is%20met%2C%20independent%20of%20the%20civil%20tethering%20violation.%0A4%3A%20Publicly%20confirm%20that%20the%20inspection%20took%20place%20and%20release%20its%20outcome.%0A%0AThis%20has%20been%20documented%20and%20escalated%20for%20two%20weeks%20without%20enforcement.%20A%20dog%20is%20suffering%20now%20and%20the%20concealment%20is%20ongoing.%20Act%20on%20it.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1lg9OeRV_Cpj4qP8hu8YWu2Etj_JSDVrj%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
