ompletely.%0A%0AThis%20is%20not%20a%20side%20issue.%20Since%202016%2C%20the%20FBI%20has%20tracked%20animal%20cruelty%20as%20a%20Group%20A%20offense%20in%20its%20national%20crime%20reporting%20system%2C%20the%20same%20category%20as%20homicide%2C%20assault%2C%20arson%20and%20kidnapping.%20It%20does%20so%20because%20the%20link%20between%20animal%20abuse%20and%20violence%20against%20people%20is%20well%20documented%3A%20people%20who%20abuse%20animals%20are%20significantly%20more%20likely%20to%20commit%20violent%20crimes%20against%20humans%2C%20and%20animal%20cruelty%20frequently%20appears%20alongside%20domestic%20violence%20and%20child%20abuse%20in%20the%20same%20households.%20A%20city%20with%20Stockton's%20record%20on%20violent%20crime%20cannot%20afford%20to%20treat%20animal%20abuse%20as%20low%20priority.%20Every%20cruelty%20case%20left%20uninvestigated%20is%20a%20warning%20sign%20ignored%2C%20and%20every%20abuser%20who%20faces%20real%20consequences%20is%20one%20less%20person%20escalating%20unchecked.%0A%0AEither%20live%20up%20to%20your%20title%20as%20Mayor%2C%20or%20continue%20as%20a%20fugazi.%0A%0AI%20demand%20that%20the%20City%20of%20Stockton%3A%0A%0A1%3A%20Issue%20a%20public%20statement%20acknowledging%20the%20killing%20and%20burning%20of%20animals%20in%20Stockton%20and%20setting%20out%20what%20the%20City%20will%20do%20about%20it%0A2%3A%20Direct%20Stockton%20Animal%20Services%20and%20Stockton%20PD%20to%20fully%20investigate%20every%20reported%20killing%2C%20burning%20and%20dumping%20of%20animals%2C%20beginning%20with%20Case%20223080%2C%20and%20refer%20every%20viable%20case%20to%20the%20San%20Joaquin%20County%20District%20Attorney%20under%20CA%20Penal%20Code%20597%0A3%3A%20Publicly%20release%20how%20many%20animal%20cruelty%20reports%20the%20City%20received%20in%20the%20last%2012%20months%2C%20how%20many%20were%20investigated%2C%20and%20how%20many%20were%20referred%20for%20prosecution%0A4%3A%20Replace%20one-day%20encampment%20sweeps%20with%20sustained%20enforcement%20
