when%20research%20showed%20that%20newborns%20operated%20on%20without%20anesthesia%20suffered%20severe%20stress%20responses%2C%20and%20that%20anesthesia%20reduced%20them.%20These%20puppies%20are%20crying%20on%20camera.%0A%0AIf%20current%20law%20cannot%20reach%20this%2C%20the%20law%20must%20change.%20Pennsylvania%20already%20restricts%20tail%20docking%20to%20licensed%20veterinarians%20once%20a%20puppy%20is%20more%20than%20five%20days%20old.%20The%20UK%20bans%20cosmetic%20docking.%20Six%20states%20and%20Washington%2C%20D.C.%20have%20banned%20cat%20declawing%2C%20a%20routine%20practice%20until%20legislators%20recognized%20it%20as%20amputation%20for%20convenience.%20Federal%20criminal%20law%20already%20holds%20that%20%E2%80%9Cstandard%20practice%E2%80%9D%20is%20no%20defense%20to%20cutting%20a%20body%20for%20non-medical%20reasons.%20Mississippi%20should%20apply%20that%20principle%20to%20dogs.%0A%0AI%20demand%20that%3A%0A%0A1%3A%20Marco%20(D%E2%80%99Marco)%20Young%20be%20investigated%20and%20charged%20under%20%C2%A7%2097-41-16%2C%20with%20each%20puppy%20charged%20as%20a%20separate%20count%2C%20and%20the%20case%20referred%20to%20the%20County%20Prosecutor%20and%20to%20District%20Attorney%20John%20K.%20Bramlett%2C%20Jr.%20for%20review%20of%20aggravated%20cruelty%20charges.%0A2%3A%20The%20litter%20and%20their%20mother%20receive%20an%20immediate%20welfare%20inspection%2C%20including%20a%20veterinary%20examination%20of%20the%20docking%20wounds%2C%20and%20be%20seized%20if%20they%20show%20injury%20or%20neglect.%0A3%3A%20Legislation%20be%20introduced%20to%20amend%20%C2%A7%2097-41-16%20so%20that%3A%0A-%20cosmetic%20tail%20docking%20and%20ear%20cropping%20are%20not%20%E2%80%9Caccepted%20agricultural%20or%20animal%20husbandry%20practices%E2%80%9D%3B%0A-%20tail%20docking%20and%20ear%20cropping%20of%20dogs%20may%20only%20be%20performed%20by%20a%20licensed%20veterinarian%20using%20anesthesia%20and%20pain%20relief%3B%0A-%20breed%20standard%2C%20custom%2C%20tradition%20or%20standard%20prac n%20infants%20until%201987%2C%20when%20research%20showed%20that%20newborns%20operated%20on%20without%20anesthesia%20suffered%20severe%20stress%20responses%2C%20and%20that%20anesthesia%20reduced%20them.%20These%20puppies%20are%20crying%20on%20camera.%0A%0AIf%20current%20law%20cannot%20reach%20this%2C%20the%20law%20must%20change.%20Pennsylvania%20already%20restricts%20tail%20docking%20to%20licensed%20veterinarians%20once%20a%20puppy%20is%20more%20than%20five%20days%20old.%20The%20UK%20bans%20cosmetic%20docking.%20Six%20states%20and%20Washington%2C%20D.C.%20have%20banned%20cat%20declawing%2C%20a%20routine%20practice%20until%20legislators%20recognized%20it%20as%20amputation%20for%20convenience.%20Federal%20criminal%20law%20already%20holds%20that%20%E2%80%9Cstandard%20practice%E2%80%9D%20is%20no%20defense%20to%20cutting%20a%20body%20for%20non-medical%20reasons.%20Mississippi%20should%20apply%20that%20principle%20to%20dogs.%0A%0AI%20demand%20that%3A%0A%0A1%3A%20Marco%20(D%E2%80%99Marco)%20Young%20be%20investigated%20and%20charged%20under%20%C2%A7%2097-41-16%2C%20with%20each%20puppy%20charged%20as%20a%20separate%20count%2C%20and%20the%20case%20referred%20to%20the%20County%20Prosecutor%20and%20to%20District%20Attorney%20John%20K.%20Bramlett%2C%20Jr.%20for%20review%20of%20aggravated%20cruelty%20charges.%0A2%3A%20The%20litter%20and%20their%20mother%20receive%20an%20immediate%20welfare%20inspection%2C%20including%20a%20veterinary%20examination%20of%20the%20docking%20wounds%2C%20and%20be%20seized%20if%20they%20show%20injury%20or%20neglect.%0A3%3A%20Legislation%20be%20introduced%20to%20amend%20%C2%A7%2097-41-16%20so%20that%3A%0A-%20cosmetic%20tail%20docking%20and%20ear%20cropping%20are%20not%20%E2%80%9Caccepted%20agricultural%20or%20animal%20husbandry%20practices%E2%80%9D%3B%0A-%20tail%20docking%20and%20ear%20cropping%20of%20dogs%20may%20only%20be%20performed%20by%20a%20licensed%20veterinarian%20using%20anesthesia%20and%20pain%20relief%3B%0A-%20breed%20standard%2C%20custom%2C%20tradition%20or%20standard%20practice%20is%20not%20a%20defense%3B%0A-%20these%20provisions%20apply%20to%20dogs%20only%20and%20do%20not%20affect%20livestock.%0A4%3A%20A%20public%20statement%20be%20issued%20on%20both%20the%20investigation%20and%20the%20legislative%20response.%0A5%3A%20All%20findings%20be%20made%20public%2C%20with%20updates%20sent%20to%20contact%40hallieforanimals.org.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1S4TZdau5VRCDi3yMSqpAvDUnPD56G-XZ%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C" rel="nofollow">Open email</a>

    function goMail() {
