y.%20Why%20should%20hard-working%20taxpayers%20fund%20a%20half-hearted%20attempt%20at%20your%20jobs%20while%20dogs%20are%20tortured%20and%20killed%20on%20Skid%20Row%3F%0A%0AI%20demand%3A%0A%0A1%3A%20The%20resignation%20of%20Councilmember%20Ysabel%20Jurado%20for%20her%20failure%20to%20act%20on%20animal%20cruelty%20in%20her%20district%0A2%3A%20Dedicated%2C%20ongoing%20funding%20from%20the%20Mayor's%20office%20for%20Animal%20Services%20enforcement%20on%20Skid%20Row%2C%20with%20a%20staffed%20presence%20and%20a%20set%20response%20time%20for%20cruelty%20reports%0A3%3A%20Public%20release%20of%20the%20Skid%20Row%20program's%20results%20since%20November%202025%3A%20cruelty%20reports%20received%2C%20cases%20investigated%2C%20animals%20removed%2C%20and%20cases%20referred%20for%20prosecution%0A4%3A%20Prosecution%20of%20animal%20cruelty%20cases%20from%20Skid%20Row%20under%20Penal%20Code%20597%2C%20with%20the%20District%20Attorney's%20office%20publicly%20reporting%20how%20many%20Skid%20Row%20cases%20it%20has%20filed%0A5%3A%20Investigation%20of%20Ocean's%20death%2C%20including%20recovery%20of%20his%20remains%20for%20a%20necropsy%2C%20and%20of%20the%20other%20cases%20reported%20by%20rescuers%0A6%3A%20Consistent%20enforcement%20of%20California's%20animal%20cruelty%20laws%20on%20Skid%20Row%2C%20with%20the%20same%20response%20any%20other%20neighborhood%20would%20receive%0A7%3A%20A%20public%20statement%20from%20each%20of%20your%20offices%20on%20how%20you%20will%20stop%20this%0A8%3A%20Full%20transparency%2C%20with%20findings%20released%20publicly%20and%20updates%20sent%20to%20contact%40hallieforanimals.org%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1MYZLcD1wy2sbtNF42MEGbOSfuYSB7NIk%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C https://lnk.bio/hallieforanimals https://lnk.bio/hallieforanimals (same as return) "mailto:councilmember.jurado@lacity.org,karen.bass@lacity.org,nhochman@da.lacounty.gov?subject=Accountability%20For%20Skid%20Row%3A%20enough%20is%20enough&bod     var MAILTO = "mailto:councilmember.jurado@lacity.org,karen.bass@lacity.org,nhochman@da.lacounty.gov?subject=Accountability%20For%20Skid%20Row%3A%20enough%20is%20enough&body=To%20whom%20it%20may%20concern%2C%0A%0AOn%20the%20night%20of%20October%204%2C%202026%2C%20a%20six-month-old%20puppy%20named%20Ocean%20was%20buried%20alive%20among%20garbage%20and%20syringes%20on%20Skid%20Row.%20Rescuers%20had%20been%20trying%20to%20reach%20him%20for%20two%20weeks.%0A%0AOcean%20is%20not%20an%20isolated%20case.%20In%20the%20weeks%20before%20his%20death%2C%20rescuers%20on%20Skid%20Row%20reported%3A%0A%0A-%20a%20dog%20set%20on%20fire%0A-%20a%20dog%20who%20dragged%20himself%20down%20the%20street%20until%20he%20died%0A-%20a%20dog%20left%20paralyzed%20after%20being%20run%20over%0A-%20four%20dogs%20abandoned%20for%20a%20week%20in%20an%20SRO%2C%20covered%20in%20feces%20and%20drugs%0A%0AIn%20September%2C%20a%20dog%20chained%20to%20a%20van%20was%20nearly%20burned%20alive%20when%20someone%20set%20the%20van%20on%20fire.%0A%0ACouncilmember%20Jurado%3A%20Skid%20Row%20is%20in%20your%20district.%20Rescuers%20have%20asked%20you%20for%20years%20to%20come%20and%20see%20what%20is%20happening%20there.%20You%20have%20not%20acted%2C%20and%20dogs%20continue%20to%20die.%0A%0AMayor%20Bass%3A%20You%20launched%20a%20Skid%20Row%20animal%20cruelty%20program%20and%20point%20to%20the%20officers%20trained%20under%20it.%20Dogs%20are%20still%20being%20burned%2C%20abandoned%20and%20buried%20alive%20in%20its%20pilot%20area.%20As%20Los%20Angeles%20heads%20to%20the%20polls%2C%20it%20is%20time%20to%20put%20your%20money%20where%20your%20mouth%20is.%0A%0ADistrict%20Attorney%20Hochman%3A%20Your%20office%20has%20said%20it%20is%20%22firmly%20committed%20to%20the%20aggressive%20prosecution%20of%20animal%20cruelty.%22%20Stick%20to%20your%20word%2C%20or%20you're%20just%20using%20it%20to%20boost%20public%20opinion.%0A%0ABetween%20you%2C%20the%20three%20of%20you%20are%20paid%20around%20%24900%2C000%20a%20year%20in%20public%20money.%20Why%20should%20hard-working%20taxpayers%20fund%20a%20half-hearted%20attempt%20at%20your%20jobs%20while%20dogs%20are%20tortured%20and%20killed%20on%20Skid%20Row%3F%0A%0AI%20demand%3A%0A%0A1%3A%20The%20resignation%20of%20Councilmember%20Ysabel%20Jurado%20for%20her%20failure%20to%20act%20on%20animal%20cruelty%20in%20her%20district%0A2%3A%20Dedicated%2C%20ongoing%20funding%20from%20the%20Mayor's%20office%20for%20Animal%20Services%20enforcement%20on%20Skid%20Row%2C%20with%20a%20staffed%20presence%20and%20a%20set%20response%20time%20for%20cruelty%20reports%0A3%3A%20Public%20release%20of%20the%20Skid%20Row%20program's%20results%20since%20November%202025%3A%20cruelty%20reports%20received%2C%20cases%20investigated%2C%20animals%20removed%2C%20and%20cases%20referred%20for%20prosecution%0A4%3A%20Prosecution%20of%20animal%20cruelty%20cases%20from%20Skid%20Row%20under%20Penal%20Code%20597%2C%20with%20the%20District%20Attorney's%20office%20publicly%20reporting%20how%20many%20Skid%20Row%20cases%20it%20has%20filed%0A5%3A%20Investigation%20of%20Ocean's%20death%2C%20including%20recovery%20of%20his%20remains%20for%20a%20necropsy%2C%20and%20of%20the%20other%20cases%20reported%20by%20rescuers%0A6%3A%20Consistent%20enforcement%20of%20California's%20animal%20cruelty%20laws%20on%20Skid%20Row%2C%20with%20the%20same%20response%20any%20other%20neighborhood%20would%20receive%0A7%3A%20A%20public%20statement%20from%20each%20of%20your%20offices%20on%20how%20you%20will%20stop%20this%0A8%3A%20Full%20transparency%2C%20with%20findings%20released%20publicly%20and%20updates%20sent%20to%20contact%40hallieforanimals.org%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1MYZLcD1wy2sbtNF42MEGbOSfuYSB7NIk%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
</body>
</html>
