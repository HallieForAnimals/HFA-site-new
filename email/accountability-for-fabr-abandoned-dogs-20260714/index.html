mediate%20ground%20rather%20than%20the%20structure%2C%20further%20demands%20forensic%20examination%2C%20including%20necropsies%20on%20deceased%20animals%2C%20full%20site%20inspection%2C%20removal%20of%20any%20remaining%20animals%2C%20and%20a%20criminal%20probe%20by%20police%20alongside%20PAWS%20to%20determine%20timelines%2C%20responsibility%2C%20and%20whether%20criminal%20acts%20occurred.%20This%20is%20not%20an%20isolated%20welfare%20matter%20but%20evidence%20of%20ongoing%20failures%20that%20have%20cost%20animal%20lives.%0A%0AWe%20expect%20prompt%20and%20decisive%20action%3A%20entry%20onto%20the%20property%2C%20seizure%20of%20evidence%2C%20veterinary%20assessments%2C%20and%20public%20updates%20on%20the%20case.%20The%20public%20is%20watching%20and%20documenting%20this%20closely%20to%20ensure%20accountability.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F14dwoEsjdi5hJikaPb5KuqViQJOQF0OjG%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
