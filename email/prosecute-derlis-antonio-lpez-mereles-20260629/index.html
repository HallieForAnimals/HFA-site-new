    var MAILTO = "mailto:comunicaciones@ministeriopublico.gov.py,secretariageneral@bienestaranimal.gov.py?subject=Se%20exige%20que%20se%20lleve%20a%20cabo%20un%20juicio%20completo%20en%20el%20caso%20del%20presidente%20Franco%2FPush%20for%20Full%20Prosecution%20in%20Presidente%20Franco%20Case&body=A%20quien%20corresponda%3A%0A%0ALes%20escribo%20en%20relaci%C3%B3n%20con%20el%20caso%20de%20Derlis%20Antonio%20L%C3%B3pez%20Mereles%20(27)%2C%20acusado%20de%20maltrato%20animal%20y%20violencia%20dom%C3%A9stica%20en%20Presidente%20Franco.%20Se%20le%20acusa%20de%20haber%20arrojado%20violentamente%20al%20suelo%20a%20un%20gatito%20indefenso%2C%20lo%20que%20le%20caus%C3%B3%20la%20muerte.%0AEste%20acto%20brutal%20ha%20causado%20indignaci%C3%B3n%20generalizada.%20Como%20ciudadano%20preocupado%20que%20aboga%20por%20el%20bienestar%20animal%20y%20la%20justicia%2C%20insto%20respetuosamente%20a%20lo%20siguiente%3A%0A%0A1.%20Que%20se%20aplique%20la%20pena%20m%C3%A1xima%20prevista%20por%20la%20ley%20paraguaya%20para%20el%20maltrato%20animal%20(Ley%206524%2F2020%20y%20estatutos%20relacionados).%0A2.%20Que%20se%20tome%20plenamente%20en%20cuenta%20el%20contexto%20de%20violencia%20dom%C3%A9stica%20denunciado.%0A3.%20Una%20actualizaci%C3%B3n%20p%C3%BAblica%20sobre%20el%20estado%20del%20caso%2C%20la%20detenci%C3%B3n%20y%20el%20cronograma%20del%20proceso%20judicial.%0A4.%20Un%20mensaje%20p%C3%BAblico%20contundente%20de%20que%20no%20se%20tolerar%C3%A1%20el%20maltrato%20animal.%0A%0ASe%20trataba%20solo%20de%20un%20gatito%20peque%C3%B1o%20e%20inocente.%20Este%20tipo%20de%20casos%20exigen%20la%20respuesta%20m%C3%A1s%20firme%20para%20proteger%20a%20los%20animales%20vulnerables%20y%20disuadir%20la%20violencia%20en%20el%20futuro.%0AGracias%20por%20su%20atenci%C3%B3n%20y%20su%20compromiso%20con%20la%20justicia.%0A%0APrueba%20en%20video%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1zZht2K4TbJCHkYNMKSdwUwZ2FcBM_6g-%2Fview%3Fusp%3Dsharing%0A%0AAtentamente%2C%0A%0A%0A%0AEquipo%20de%20%40HallieForAnimals%0Acontact%40hallieforanimals.org%0A%0A%0ATo%20whom%20it%20may%20concern%2C%0A%0AI%20am%20writing%20regarding%20the%20case%20of%20Derlis%20Antonio%20L%C3%B3pez%20Mereles%20(27)%2C%20charged%20with%20animal%20cruelty%20and%20domestic%20violence%20in%20Presidente%20Franco.%20He%20is%20accused%20of%20violently%20throwing%20a%20defenseless%20kitten%20to%20the%20ground%2C%20resulting%20in%20its%20death.%0AThis%20brutal%20act%20has%20caused%20widespread%20outrage.%20As%20a%20concerned%20citizen%20advocating%20for%20animal%20welfare%20and%20justice%2C%20I%20respectfully%20urge%3A%0A%0A1.%20The%20maximum%20legal%20penalty%20under%20Paraguayan%20law%20for%20animal%20cruelty%20(Law%206524%2F2020%20and%20related%20statutes).%0A2.%20Full%20consideration%20of%20the%20reported%20domestic%20violence%20context.%0A3.%20A%20public%20update%20on%20the%20case%20status%2C%20arrest%2C%20and%20prosecution%20timeline.%0A4.%20A%20strong%20public%20message%20that%20animal%20abuse%20will%20not%20be%20tolerated.%0A%0AThis%20was%20only%20a%20small%2C%20innocent%20kitten.%20Such%20cases%20demand%20the%20strongest%20response%20to%20protect%20vulnerable%20animals%20and%20deter%20future%20violence.%0AThank%20you%20for%20your%20attention%20and%20commitment%20to%20justice.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1zZht2K4TbJCHkYNMKSdwUwZ2FcBM_6g-%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://hallieforanimals.org/recent.html";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
