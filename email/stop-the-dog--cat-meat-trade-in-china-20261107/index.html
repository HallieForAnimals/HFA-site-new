8F%AA%E5%B1%A0%E5%AE%B0%E5%92%8C%E9%94%80%E5%94%AE%E3%80%82%0A6%EF%BC%9A%E5%8F%91%E5%B8%83%E5%85%AC%E5%BC%80%E5%A3%B0%E6%98%8E%EF%BC%8C%E9%98%90%E6%98%8E%E6%94%BF%E5%BA%9C%E5%85%B3%E4%BA%8E%E7%BB%88%E6%AD%A2%E8%AF%A5%E8%B4%B8%E6%98%93%E7%9A%84%E7%AB%8B%E5%9C%BA%E5%8F%8A%E6%97%B6%E9%97%B4%E8%A1%A8%E3%80%82%0A7%EF%BC%9A%E5%85%A8%E9%9D%A2%E5%85%AC%E5%B8%83%E6%89%A7%E6%B3%95%E6%95%B0%E6%8D%AE%EF%BC%8C%E5%8C%85%E6%8B%AC%E6%9F%A5%E8%8E%B7%E3%80%81%E5%8F%96%E7%BC%94%E5%92%8C%E8%B5%B7%E8%AF%89%E6%83%85%E5%86%B5%E3%80%82%0A8%EF%BC%9A%E5%B0%86%E9%87%87%E5%8F%96%E8%A1%8C%E5%8A%A8%E7%9A%84%E6%9C%80%E6%96%B0%E8%BF%9B%E5%B1%95%E5%8F%91%E9%80%81%E8%87%B3%20contact%40hallieforanimals.org%E3%80%82%0A%0A%E6%AD%A4%E8%87%B4%EF%BC%8C%0A%0A%0A%0A%0ATo%20whom%20it%20may%20concern%2C%0A%0AIn%202020%2C%20the%20Ministry%20of%20Agriculture%20and%20Rural%20Affairs%20left%20dogs%20out%20of%20the%20National%20Catalogue%20of%20Livestock%20and%20Poultry%20Genetic%20Resources%20and%20stated%20that%20dogs%20are%20companion%20animals%2C%20not%20livestock.%20That%20same%20year%2C%20Shenzhen%20and%20Zhuhai%20banned%20the%20consumption%20of%20dog%20meat.%20China%20has%20already%20said%20where%20dogs%20stand.%20The%20law%20has%20not%20caught%20up.%0A%0AThe%20trade%20continues%20on%20a%20mass%20scale%2C%20with%20an%20estimated%2010%20million%20dogs%20killed%20each%20year.%20It%20runs%20largely%20outside%20the%20law.%20There%20is%20no%20legal%20quarantine%20or%20slaughter-inspection%20system%20for%20dogs.%20Many%20of%20the%20dogs%20are%20stolen%20family%20pets%2C%20transported%20in%20overcrowded%20cages%20over%20long%20distances%20and%20killed%20in%20unlicensed%20slaughterhouses.%20This%20is%20a%20public%20health%20risk%2C%20including%20the%20spread%20of%20rabies%2C%20as%20well%20as%20a%20welfare%20crisis%2C%20and%20it%20continues%20in%20open%20defiance%20of%20the%20government%E2%80%99s%20own%20position.%0A%0AI%20call%20on%20the%20Chinese%20government%20to%3A%0A%0A1%3A%20Enact%20a%20nationwide%20legal%20ban%20on%20the%20slaughter%2C%20sale%2C%20and%20consumption%20of%20dog%20meat%2C%20extending%20the%20Shenzhen%20and%20Zhuhai%20precedent%20to%20the%20whole%20country.%0A2%3A%20Formally%20codify%20in%20law%20that%20dogs%20are%20companion%20animals%2C%20not%20livestock.%0A3%3A%20Enforce%20existing%20animal%20epidemic%20prevention%20and%20food%20safety%20laws%20now%20against%20the%20transport%2C%20slaughter%2C%20and%20sale%20of%20dogs%20without%20quarantine%20certification%2C%20including%20at%20markets%2C%20restaurants%2C%20and%20roadside%20checkpoints.%0A4%3A%20Investigate%20and%20prosecute%20dog%20theft%20supplying%20the%20trade.%0A5%3A%20Direct%20authorities%20in%20Guangxi%2C%20including%20Yulin%2C%20to%20stop%20dog%20slaughter%20and%20sale%20during%20the%20annual%20June%20festival%20period.%0A6%3A%20Issue%20a%20public%20statement%20setting%20out%20the%20government%E2%80%99s%20position%20and%20timeline%20for%20ending%20the%20trade.%0A7%3A%20Publish%20enforcement%20data%20in%20full%2C%20including%20seizures%2C%20closures%2C%20and%20prosecutions.%0A8%3A%20Send%20updates%20on%20action%20taken%20to%20contact%40hallieforanimals.org.%0A%0ASincerely%2C" rel="nofollow">Open email</a>

2%8C%E9%94%80%E5%94%AE%E3%80%82%0A6%EF%BC%9A%E5%8F%91%E5%B8%83%E5%85%AC%E5%BC%80%E5%A3%B0%E6%98%8E%EF%BC%8C%E9%98%90%E6%98%8E%E6%94%BF%E5%BA%9C%E5%85%B3%E4%BA%8E%E7%BB%88%E6%AD%A2%E8%AF%A5%E8%B4%B8%E6%98%93%E7%9A%84%E7%AB%8B%E5%9C%BA%E5%8F%8A%E6%97%B6%E9%97%B4%E8%A1%A8%E3%80%82%0A7%EF%BC%9A%E5%85%A8%E9%9D%A2%E5%85%AC%E5%B8%83%E6%89%A7%E6%B3%95%E6%95%B0%E6%8D%AE%EF%BC%8C%E5%8C%85%E6%8B%AC%E6%9F%A5%E8%8E%B7%E3%80%81%E5%8F%96%E7%BC%94%E5%92%8C%E8%B5%B7%E8%AF%89%E6%83%85%E5%86%B5%E3%80%82%0A8%EF%BC%9A%E5%B0%86%E9%87%87%E5%8F%96%E8%A1%8C%E5%8A%A8%E7%9A%84%E6%9C%80%E6%96%B0%E8%BF%9B%E5%B1%95%E5%8F%91%E9%80%81%E8%87%B3%20contact%40hallieforanimals.org%E3%80%82%0A%0A%E6%AD%A4%E8%87%B4%EF%BC%8C%0A%0A%0A%0A%0ATo%20whom%20it%20may%20concern%2C%0A%0AIn%202020%2C%20the%20Ministry%20of%20Agriculture%20and%20Rural%20Affairs%20left%20dogs%20out%20of%20the%20National%20Catalogue%20of%20Livestock%20and%20Poultry%20Genetic%20Resources%20and%20stated%20that%20dogs%20are%20companion%20animals%2C%20not%20livestock.%20That%20same%20year%2C%20Shenzhen%20and%20Zhuhai%20banned%20the%20consumption%20of%20dog%20meat.%20China%20has%20already%20said%20where%20dogs%20stand.%20The%20law%20has%20not%20caught%20up.%0A%0AThe%20trade%20continues%20on%20a%20mass%20scale%2C%20with%20an%20estimated%2010%20million%20dogs%20killed%20each%20year.%20It%20runs%20largely%20outside%20the%20law.%20There%20is%20no%20legal%20quarantine%20or%20slaughter-inspection%20system%20for%20dogs.%20Many%20of%20the%20dogs%20are%20stolen%20family%20pets%2C%20transported%20in%20overcrowded%20cages%20over%20long%20distances%20and%20killed%20in%20unlicensed%20slaughterhouses.%20This%20is%20a%20public%20health%20risk%2C%20including%20the%20spread%20of%20rabies%2C%20as%20well%20as%20a%20welfare%20crisis%2C%20and%20it%20continues%20in%20open%20defiance%20of%20the%20government%E2%80%99s%20own%20position.%0A%0AI%20call%20on%20the%20Chinese%20government%20to%3A%0A%0A1%3A%20Enact%20a%20nationwide%20legal%20ban%20on%20the%20slaughter%2C%20sale%2C%20and%20consumption%20of%20dog%20meat%2C%20extending%20the%20Shenzhen%20and%20Zhuhai%20precedent%20to%20the%20whole%20country.%0A2%3A%20Formally%20codify%20in%20law%20that%20dogs%20are%20companion%20animals%2C%20not%20livestock.%0A3%3A%20Enforce%20existing%20animal%20epidemic%20prevention%20and%20food%20safety%20laws%20now%20against%20the%20transport%2C%20slaughter%2C%20and%20sale%20of%20dogs%20without%20quarantine%20certification%2C%20including%20at%20markets%2C%20restaurants%2C%20and%20roadside%20checkpoints.%0A4%3A%20Investigate%20and%20prosecute%20dog%20theft%20supplying%20the%20trade.%0A5%3A%20Direct%20authorities%20in%20Guangxi%2C%20including%20Yulin%2C%20to%20stop%20dog%20slaughter%20and%20sale%20during%20the%20annual%20June%20festival%20period.%0A6%3A%20Issue%20a%20public%20statement%20setting%20out%20the%20government%E2%80%99s%20position%20and%20timeline%20for%20ending%20the%20trade.%0A7%3A%20Publish%20enforcement%20data%20in%20full%2C%20including%20seizures%2C%20closures%2C%20and%20prosecutions.%0A8%3A%20Send%20updates%20on%20action%20taken%20to%20contact%40hallieforanimals.org.%0A%0ASincerely%2C";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
