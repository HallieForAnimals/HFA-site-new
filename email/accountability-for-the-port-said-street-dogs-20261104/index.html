ulture%20has%20stated%20that%20poisoning%2C%20mass%20killing%2C%20and%20relocating%20animals%20outside%20the%20competent%20authorities%20are%20prohibited.%20Port%20Said%E2%80%99s%20Veterinary%20Directorate%20has%20also%20referred%20its%20own%20dog-collection%20committee%20for%20investigation%20without%20explaining%20why.%20The%20public%20is%20entitled%20to%20know%20what%20is%20happening%20to%20these%20animals.%0A%0AI%20demand%20that%20the%20Port%20Said%20authorities%3A%0A%0AImmediately%20halt%20any%20killing%2C%20poisoning%2C%20or%20unrecorded%20removal%20of%20street%20dogs.%0APublish%20the%20number%20of%20dogs%20collected%20since%20September%202026%20and%20the%20current%20status%20and%20location%20of%20each.%0AAllow%20independent%20inspection%20of%20the%20South%20Port%20Said%20shelters%20by%20the%20General%20Organization%20for%20Veterinary%20Services%20and%20recognized%20animal%20welfare%20federations.%0ARun%20vaccination%20and%20sterilization%20in%20line%20with%20the%20national%20plan%20and%20Law%20No.%2029%20of%202023.%0APublicly%20disclose%20the%20findings%20of%20the%20investigation%20into%20the%20dog-collection%20committee.%0AIssue%20a%20public%20statement%20confirming%20Port%20Said%E2%80%99s%20compliance%20with%20the%20national%20plan%2C%20and%20send%20updates%20to%20contact%40hallieforanimals.org%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1wIexjT9KSVqd4KkAvPuvZGmNrWMdrWkA%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C";
