    var MAILTO = "mailto:ward.roddam@rockdaletx.gov,mclore@milamcounty.net?subject=Request%20for%20Thorough%20Investigation%20into%20Conditions%20at%20Dogtown%20Ranch%20and%20Sanctuary&body=To%20whom%20it%20may%20concern%2C%0A%0AI%20am%20writing%20to%20urge%20your%20office%20to%20take%20the%20serious%20allegations%20of%20animal%20neglect%20and%20suffering%20at%20Downtown%20Ranch%20and%20Sanctuary%2FDogtown%20Ranch%20(1279%20FM%202116%2C%20Rockdale%2C%20TX%2076567)%2C%20owned%20by%20Angela%20Sera%2C%20with%20the%20full%20weight%20and%20ongoing%20attention%20they%20deserve.%0A%0AA%20detailed%20Houston%20Press%20investigation%20(published%20July%2027%2C%202026)%20documents%20extensive%20photographic%20and%20video%20evidence%20gathered%20by%20visitors%20and%20former%20volunteers%20between%20August%202025%20and%20March%202026.%20These%20materials%20depict%20feces-%20and%20urine-covered%20floors%20and%20kennels%2C%20a%20decomposing%20dead%20pit%20bull%20left%20in%20front%20of%20other%20dogs%2C%20charred%20dog%20carcasses%20on%20burn%20piles%2C%20reports%20of%20dogs%20escaping%20and%20being%20killed%20in%20traffic%2C%20alleged%20fatal%20dog%20fights%2C%20and%20animals%20with%20untreated%20gaping%20wounds.%20Volunteers%20have%20expressed%20fear%20for%20the%20dogs%E2%80%99%20welfare%20during%20extreme%20Texas%20heat%2C%20especially%20given%20the%20boarding%20fees%20the%20facility%20generates.%0A%0AThis%20stands%20in%20sharp%20contrast%20to%20earlier%20deputy%20responses%20that%20characterized%20complaints%20as%20%E2%80%9Cunfounded%E2%80%9D%20after%20limited%20observations%20from%20the%20gate%20and%20notes%20of%20available%20food%20bags.%20While%20I%20acknowledge%20that%20your%20office%20has%20conducted%20subsequent%20unannounced%20inspections%20(including%20with%20outside%20animal-welfare%20professionals%20and%20a%20veterinarian)%2C%20coordinated%20with%20groups%20such%20as%20SPCA%20of%20Texas%2C%20and%20reported%20that%20dogs%20had%20access%20to%20food%20and%20water%20and%20that%20the%20owner%20is%20making%20improvements%20and%20reducing%20numbers%2C%20the%20volume%20and%20graphic%20nature%20of%20the%20independent%20evidence%20raise%20legitimate%20public%20concern%20that%20conditions%20have%20been%E2%80%94and%20may%20still%20be%E2%80%94significantly%20worse%20than%20official%20walkthroughs%20have%20captured.%0A%0AI%20respectfully%20request%20that%20your%20office%3A%0A%0A1%3A%20Fully%20review%20and%20forensically%20evaluate%20all%20submitted%20photos%2C%20videos%2C%20and%20written%20complaints.%0A2%3A%20Conduct%20additional%20unannounced%20inspections%20with%20independent%20veterinarians%20and%20animal-cruelty%20specialists%2C%20focusing%20on%20the%20interior%20kennels%2C%20burn%20piles%2C%20medical%20records%2C%20and%20overall%20population%20management.%0A3%3A%20Ensure%20transparent%20follow-up%20so%20the%20public%20can%20have%20confidence%20that%20every%20animal%E2%80%99s%20welfare%20is%20being%20prioritized%20under%20Texas%20animal-cruelty%20statutes.%0A4%3A%20Continue%20close%20monitoring%20to%20verify%20that%20promised%20reductions%20in%20numbers%20and%20facility%20improvements%20are%20fully%20and%20sustainably%20implemented.%0A%0AThe%20dogs%20at%20this%20facility%E2%80%94many%20described%20as%20elderly%2C%20medically%20compromised%2C%20or%20difficult%20to%20place%E2%80%94depend%20on%20rigorous%20oversight.%20Public%20trust%20in%20local%20law%20enforcement%E2%80%99s%20handling%20of%20animal-welfare%20cases%20depends%20on%20thorough%2C%20evidence-based%20action.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F16s1FPkk6_VYACfKJFdhj8cdaERSgnZnh%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
