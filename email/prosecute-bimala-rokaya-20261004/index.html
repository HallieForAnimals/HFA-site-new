  (function () {
    var MAILTO = "mailto:daobajhang@moha.gov.np,daooffice71@gmail.com,dpobajhang@nepalpolice.gov.np,bajhangpolice10@gmail.com,dgao.bajhang@ag.gov.np,attorneyoffice.bajhang@gmail.com,vhlsecbajhang@sudurpashchim.gov.np,gunaso@moha.gov.np?subject=Dog%20thrown%20into%20the%20Seti%20River%20at%20Pankot%20Bridge%3A%20remove%20the%20dog%20and%20prosecute%20under%20Section%20290&body=To%20whom%20it%20may%20concern%2C%0A%0AI%20am%20writing%20about%20the%20dog%20thrown%20from%20Pankot%20Bridge%20in%20Chainpur%2C%20Jayaprithvi%20Municipality-10%2C%20into%20the%20Seti%20River%20in%20September%202026.%20Video%20of%20the%20incident%20appears%20to%20show%20a%20woman%20forcing%20the%20dog%20under%20the%20bridge%20railing%20and%20into%20the%20river%20while%20the%20dog%20resisted.%0A%0APolice%20arrested%20Bimala%20Devi%20Rokaya%2C%2042%2C%20of%20Pades%2C%20Jayaprithvi%20Municipality-3%2C%20on%20Asoj%201%20(around%2017%20September).%20According%20to%20police%2C%20she%20stated%20that%20the%20dog%20was%20kept%20at%20her%20home%2C%20had%20been%20sick%20for%20about%20two%20weeks%20with%20a%20festering%20wound%20to%20the%20rear%20of%20the%20body%2C%20and%20had%20begun%20biting%20passersby%2C%20and%20that%20she%20threw%20the%20dog%20into%20the%20river%20for%20that%20reason.%20She%20has%20since%20been%20released%20on%20bail%20by%20the%20District%20Administration%20Office.%0A%0AAnimal%20welfare%20organization%20Aatmoutsarga%20Nepal%20has%20reported%20finding%20the%20dog%20alive%20at%20a%20house%20connected%20to%20her.%20A%20dog%20who%20was%20reportedly%20sick%20and%20untreated%2C%20and%20who%20was%20then%20thrown%20into%20a%20river%2C%20may%20now%20be%20back%20in%20the%20care%20of%20the%20person%20accused%20of%20doing%20it.%0A%0ASection%20290%20of%20the%20Muluki%20Criminal%20Code%202074%20prohibits%20cruel%20treatment%20of%20animals%2C%20including%20abandoning%20one's%20own%20sick%20or%20old%20animal%20in%20a%20public%20place.%20The%20account%20given%20to%20police%20describes%20that%20conduct.%20Whether%20the%20offence%20is%20proven%20is%20for%20the%20adjudicating%20authority%20to%20decide%2C%20but%20the%20case%20must%20go%20forward.%20The%20limitation%20period%20for%20a%20Section%20290%20offence%20is%20three%20months%20from%20the%20date%20of%20the%20offence%2C%20so%20a%20charge%20must%20be%20filed%20before%20mid-December.%0A%0AI%20am%20asking%20you%20to%3A%0A%0A1.%20Have%20the%20Veterinary%20Hospital%20and%20Livestock%20Service%20Centre%20examine%20and%20treat%20the%20dog%20immediately.%0A2.%20Remove%20the%20dog%20from%20the%20accused's%20custody%20and%20place%20the%20dog%20with%20a%20recognized%20animal%20welfare%20organization%20or%20a%20responsible%20caretaker.%0A3.%20File%20a%20Section%20290%20charge%20against%20the%20accused%20within%20the%20limitation%20period.%0A4.%20Seek%20the%20maximum%20penalty%20available%3A%20three%20months'%20imprisonment%20and%20a%20fine%20of%20Rs%205%2C000%2C%20both%20together.%0A5.%20Secure%20all%20evidence%2C%20including%20the%20video%2C%20eyewitness%20accounts%20from%20the%20bridge%2C%20and%20veterinary%20findings%20on%20the%20dog's%20condition.%0A6.%20Issue%20a%20public%20statement%20on%20the%20case%2C%20and%20send%20updates%20on%20the%20dog's%20welfare%20and%20the%20prosecution%20to%20contact%40hallieforanimals.org.%0A%0AThis%20dog%20survived%20being%20thrown%20into%20a%20river.%20The%20dog%20should%20not%20be%20returned%20to%20the%20person%20accused%20of%20throwing%20them%20in.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1Z6WszgcH_OI6P3I7L6X9TQCBhmxx05iC%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0ACase%20updates%3A%20contact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
</body>
</html>
