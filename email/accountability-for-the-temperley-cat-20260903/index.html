e%20el%20asunto%20no%20quede%20cerrado%20sin%20que%20se%20adopte%20ninguna%20medida.%0A%0A5.%20Que%20dichas%20medidas%20incluyan%20evaluaci%C3%B3n%20y%20apoyo%20psicol%C3%B3gico%2C%20dado%20el%20v%C3%ADnculo%20documentado%20entre%20el%20maltrato%20animal%20y%20la%20violencia%20interpersonal%20posterior.%0A%0A6.%20Que%20se%20refuerce%20la%20educaci%C3%B3n%20en%20humanidad%20y%20empat%C3%ADa%20en%20todo%20el%20alumnado.%0A%0A7.%20Que%20se%20confirmen%20p%C3%BAblicamente%20las%20medidas%20concretas%20adoptadas.%0A%0ANo%20pido%20que%20se%20identifique%20al%20estudiante%2C%20y%20no%20lo%20identifico.%20Mi%20preocupaci%C3%B3n%20es%20la%20respuesta%20institucional%20y%20judicial%2C%20y%20que%20este%20adolescente%20reciba%20la%20intervenci%C3%B3n%20que%20requiere%20el%20momento.%0A%0AEvidencia%20en%20video%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1jDZqXR0oVJrq8nqv0ee2YrHgUTTFmc42%2Fview%3Fusp%3Dsharing%0A%0AAtentamente%2C%0A%0AEquipo%20%40HallieForAnimals%0Acontact%40hallieforanimals.org%0A%0A%0A%0A%0ATo%20whom%20it%20may%20concern%2C%0A%0AI%20am%20writing%20regarding%20the%20incident%20this%20week%20in%20Temperley%2C%20in%20which%20a%20student%20wearing%20the%20school's%20uniform%20was%20filmed%20stomping%20on%20a%20cat's%20head%20on%20a%20public%20street%20%E2%80%94%20a%20case%20now%20under%20investigation%20by%20the%20juvenile%20fuero.%20Deliberate%20animal%20cruelty%20by%20an%20adolescent%20is%20a%20recognized%20warning%20sign%2C%20associated%20in%20research%20with%20later%20interpersonal%20violence%2C%20and%20it%20warrants%20a%20substantive%20response%20rather%20than%20a%20public%20statement%20alone.%20I%20ask%20that%20the%20following%20steps%20be%20taken%3A%0A%0A1%3A%20That%20the%20school%20address%20the%20incident%20through%20its%20convivencia%20and%20safeguarding%20framework%2C%20with%20concrete%20measures%2C%20rather%20than%20treat%20the%20public%20statement%20as%20the%20matter%20resolved.%0A2%3A%20That%20the%20student%20receive%20a%20professional%20psychological%20and%20behavioral%20assessment%20and%20appropriate%20follow-up%2C%20directed%20at%20evaluation%20and%20intervention%20rather%20than%20exposure%20or%20punishment.%0A3%3A%20That%20the%20investigation%20carry%20through%20in%20full%20the%20study%20the%20law%20requires%20into%20the%20young%20person's%20personality%20and%20his%20family%20and%20environmental%20circumstances%2C%20in%20direct%20contact%20with%20the%20adolescent%20and%20his%20family.%0A4%3A%20That%20the%20corresponding%20protective%20and%20socio-educational%20measures%20be%20ordered%20on%20the%20basis%20of%20that%20study%2C%20so%20the%20matter%20is%20not%20closed%20without%20any%20measure%20adopted.%0A5%3A%20That%20those%20measures%20include%20psychological%20assessment%20and%20support%2C%20given%20the%20documented%20link%20between%20animal%20cruelty%20and%20later%20interpersonal%20violence.%0A6%3A%20That%20humane%20and%20empathy%20education%20be%20strengthened%20across%20the%20student%20body.%0A7%3A%20That%20the%20concrete%20measures%20adopted%20be%20confirmed%20publicly.%0A%0AI%20do%20not%20ask%20that%20the%20student%20be%20identified%2C%20and%20I%20do%20not%20identify%20him.%20My%20concern%20is%20the%20institutional%20and%20judicial%20response%2C%20and%20that%20this%20adolescent%20receives%20the%20intervention%20the%20moment%20calls%20for.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1jDZqXR0oVJrq8nqv0ee2YrHgUTTFmc42%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org https://lnk.bio/hallieforanimals https://lnk.bio/hallieforanimals (same as return) "mailto:fepj.lz@mpba.gov.ar,sanfranciscojavierlomas@gmail.com?subject=Maltrato%20animal%20filmado%20en%20Temperley%2FAnimal%20abuse%20filmed%20in%20Temperley&body=A%20quien%20corresponda%3A%0A%0ALes%20escribo%20en%20relaci%C3%B3n%20con%20el%20incidente%20ocurrido%20esta%20semana%20en%20Temperley%2C%20donde%20un%20estudiante%2C%20vistiendo%20el%20uniforme%20escolar%2C%2 ive%20a%20professional%20psychological%20and%20behavioral%20assessment%20and%20appropriate%20follow-up%2C%20directed%20at%20evaluation%20and%20intervention%20rather%20than%20exposure%20or%20punishment.%0A3%3A%20That%20the%20investigation%20carry%20through%20in%20full%20the%20study%20the%20law%20requires%20into%20the%20young%20person's%20personality%20and%20his%20family%20and%20environmental%20circumstances%2C%20in%20direct%20contact%20with%20the%20adolescent%20and%20his%20family.%0A4%3A%20That%20the%20corresponding%20protective%20and%20socio-educational%20measures%20be%20ordered%20on%20the%20basis%20of%20that%20study%2C%20so%20the%20matter%20is%20not%20closed%20without%20any%20measure%20adopted.%0A5%3A%20That%20those%20measures%20include%20psychological%20assessment%20and%20support%2C%20given%20the%20documented%20link%20between%20animal%20cruelty%20and%20later%20interpersonal%20violence.%0A6%3A%20That%20humane%20and%20empathy%20education%20be%20strengthened%20across%20the%20student%20body.%0A7%3A%20That%20the%20concrete%20measures%20adopted%20be%20confirmed%20publicly.%0A%0AI%20do%20not%20ask%20that%20the%20student%20be%20identified%2C%20and%20I%20do%20not%20identify%20him.%20My%20concern%20is%20the%20institutional%20and%20judicial%20response%2C%20and%20that%20this%20adolescent%20receives%20the%20intervention%20the%20moment%20calls%20for.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1jDZqXR0oVJrq8nqv0ee2YrHgUTTFmc42%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org" rel="nofollow">Open email</a>
