nd%20cancellation%20of%20the%20licence%20under%20Section%2017%20of%20the%20Arms%20Act.%0A4%3A%20Identify%20the%20shooter's%20employer.%20Establish%20whether%20the%20rifle%20is%20personally%20licensed%20or%20agency-issued%2C%20and%20whether%20he%20was%20authorized%20to%20carry%20it%20outside%20duty.%20If%20a%20private%20security%20agency%20is%20involved%2C%20refer%20it%20to%20the%20controlling%20authority%20under%20the%20Private%20Security%20Agencies%20(Regulation)%20Act%2C%202005.%0A5%3A%20Preserve%20all%20CCTV%20footage%20and%20secure%20post-mortem%20and%20ballistic%20evidence%20for%20the%20charge%20sheet.%0A6%3A%20Issue%20a%20public%20statement%20on%20the%20arrest%20and%20charges%2C%20and%20release%20the%20case%20outcome%20publicly.%20Send%20updates%20on%20this%20case%20to%20contact%40hallieforanimals.org%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F111k_y2t2LDwBiTzbPI5QBbnGN4gIoIZN%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";

      }
      launched = true;

    function goBack() {
      if (wentBack) return;

    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });

      if (launched) blurredAfterLaunch = true;

      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });

    });

    if (isInstagramIab) {

        if (launched && !wentBack) goBack();
