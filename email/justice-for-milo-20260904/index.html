%20felony%2C%20not%20the%20%C2%A7%20353%20misdemeanor%20that%20cases%20like%20this%20too%20often%20default%20to.%0A2%3A%20Refuse%20any%20plea%20reduction%20to%20a%20misdemeanor%2C%20and%20oppose%20any%20diversion%20or%20conditional%20discharge%20that%20would%20clear%20this%20from%20his%20record.%20Recorded%2C%20deliberate%20injury%20to%20a%20dog%20in%20paid%20care%20is%20not%20a%20candidate%20for%20a%20slap%20on%20the%20wrist.%0A3%3A%20Secure%20and%20preserve%20the%20original%20CCTV%20and%20the%20certified%20veterinary%20records%2C%20including%20imaging%20and%20the%20prognosis%20on%20Milo's%20mobility%2C%20as%20the%20backbone%20of%20the%20serious-injury%20element.%0A4%3A%20Seek%20a%20court%20order%20barring%20Cole%20Kamrath%20from%20owning%2C%20working%20with%2C%20or%20having%20custody%20of%20animals.%20He%20abused%20a%20dog%20inside%20a%20professional%20pet-care%20facility%3B%20he%20should%20not%20be%20trusted%20with%20another.%0A5%3A%20Seek%20the%20full%20penalties%20available%20on%20conviction%2C%20including%20restitution%20for%20Milo's%20veterinary%20care.%0A6%3A%20State%20publicly%20which%20charge%20level%20your%20office%20is%20pursuing%2C%20so%20this%20community%20knows%20that%20abusing%20an%20animal%20entrusted%20to%20professional%20care%20carries%20real%20consequences%20here.%0A%0AThe%20footage%20exists.%20The%20injuries%20are%20documented.%20His%20own%20employer%20watched%20it%2C%20fired%20him%2C%20and%20called%20the%20police.%20Charge%20it%20as%20the%20felony%20it%20is.%20Prosecute%20Cole%20Kamrath%20under%20%C2%A7%20353-a.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1VW1YnYKDaepe1MzVX54gdhCt0rgOualy%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org https://lnk.bio/hallieforanimals https://lnk.bio/hallieforanimals (same as return) "mailto:scacace@westchesterda.net?subject=Prosecute%20Cole%20Kamrath&body=To%20whom%20it%20may%20concern%2C%0A%0AYou%20built%20Westchester's     var MAILTO = "mailto:scacace@westchesterda.net?subject=Prosecute%20Cole%20Kamrath&body=To%20whom%20it%20may%20concern%2C%0A%0AYou%20built%20Westchester's%20first%20dedicated%20animal%20cruelty%20unit.%20You%20have%20publicly%20called%20what%20was%20done%20to%20Milo%20cruel%20and%20callous%2C%20and%20said%20there%20is%20never%20an%20excuse%20for%20it.%20This%20case%20is%20where%20that%20record%20is%20tested%2C%20and%20supporters%20expect%20it%20to%20be%20met%20with%20the%20charge%20the%20evidence%20supports%2C%20not%20a%20lesser%20one.%0A%0AMilo%2C%20a%2014-pound%20terrier%2C%20was%20entrusted%20to%20the%20Dogtopia%20facility%20in%20Peekskill%20for%20daycare.%20He%20came%20home%20unable%20to%20walk%20properly%2C%20off%20his%20food%2C%20and%20lethargic.%20A%20veterinary%20exam%20found%20bruising%20across%20his%20abdomen%20consistent%20with%20blunt-force%20trauma.%20That%20discovery%20led%20to%20the%20facility's%20own%20internal%20CCTV%2C%20which%20captured%20employee%20Cole%20Kamrath%20abusing%20him.%20Dogtopia%20fired%20him%20and%20called%20police%2C%20and%20he%20was%20arrested%20and%20charged.%20This%20was%20not%20rough%20handling.%20It%20was%20the%20deliberate%20beating%20of%20a%20small%2C%20defenseless%20dog%20who%20could%20not%20get%20away%2C%20inflicted%20by%20the%20very%20person%20paid%20to%20care%20for%20him%2C%20and%20caught%20on%20camera.%0A%0AConduct%20like%20this%20belongs%20under%20Agriculture%20and%20Markets%20Law%20%C2%A7%20353-a%2C%20aggravated%20cruelty%20to%20animals%2C%20Buster's%20Law%2C%20a%20felony.%20Milo%20is%20a%20companion%20animal%20under%20%C2%A7%20350.%20The%20internal%20footage%20establishes%20the%20aggravated%2C%20deliberate%20manner.%20%0A%0AThe%20veterinary%20findings%2C%20abdominal%20bruising%2C%20blunt-force%20trauma%2C%20loss%20of%20mobility%2C%20go%20to%20intentional%20serious%20physical%20injury.%20Charge%20it%20as%20the%20crime%20it%20is%3A%0A%0A1%3A%20Prosecute%20this%20as%20aggravated%20cruelty%20under%20%C2%A7%20353-a%2C%20the%20felony%2C%20not%20the%20%C2%A7%20353%20misdemeanor%20that%20cases%20like%20this%20too%20often%20default%20to.%0A2%3A%20Refuse%20any%20plea%20reduction%20to%20a%20misdemeanor%2C%20and%20oppose%20any%20diversion%20or%20conditional%20discharge%20that%20would%20clear%20this%20from%20his%20record.%20Recorded%2C%20deliberate%20injury%20to%20a%20dog%20in%20paid%20care%20is%20not%20a%20candidate%20for%20a%20slap%20on%20the%20wrist.%0A3%3A%20Secure%20and%20preserve%20the%20original%20CCTV%20and%20the%20certified%20veterinary%20records%2C%20including%20imaging%20and%20the%20prognosis%20on%20Milo's%20mobility%2C%20as%20the%20backbone%20of%20the%20serious-injury%20element.%0A4%3A%20Seek%20a%20court%20order%20barring%20Cole%20Kamrath%20from%20owning%2C%20working%20with%2C%20or%20having%20custody%20of%20animals.%20He%20abused%20a%20dog%20inside%20a%20professional%20pet-care%20facility%3B%20he%20should%20not%20be%20trusted%20with%20another.%0A5%3A%20Seek%20the%20full%20penalties%20available%20on%20conviction%2C%20including%20restitution%20for%20Milo's%20veterinary%20care.%0A6%3A%20State%20publicly%20which%20charge%20level%20your%20office%20is%20pursuing%2C%20so%20this%20community%20knows%20that%20abusing%20an%20animal%20entrusted%20to%20professional%20care%20carries%20real%20consequences%20here.%0A%0AThe%20footage%20exists.%20The%20injuries%20are%20documented.%20His%20own%20employer%20watched%20it%2C%20fired%20him%2C%20and%20called%20the%20police.%20Charge%20it%20as%20the%20felony%20it%20is.%20Prosecute%20Cole%20Kamrath%20under%20%C2%A7%20353-a.%0A%0AVideo%20evidence%3A%20https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1VW1YnYKDaepe1MzVX54gdhCt0rgOualy%2Fview%3Fusp%3Dsharing%0A%0ASincerely%2C%0A%0A%0A%0A%40HallieForAnimals%20Team%0Acontact%40hallieforanimals.org";
    var RETURN_TO = "https://lnk.bio/hallieforanimals";
    var wentBack = false;
    var launched = false;
    var blurredAfterLaunch = false;
    var launchAtMs = 0;
    var ua = navigator.userAgent || '';
    var isInstagramIab = /Instagram/i.test(ua);
    function goMail() {
      var a = document.getElementById('open');
      if (a) {
        try { a.click(); } catch (e) { /* ignore */ }
      }
      try {
        window.location.href = MAILTO;
      } catch (e) {
        try { window.location.assign(MAILTO); } catch (e2) { /* ignore */ }
      }
      launched = true;
      launchAtMs = Date.now();
    }
    setTimeout(goMail, 200);
    function goBack() {
      if (wentBack) return;
      wentBack = true;
      try { location.assign(RETURN_TO); } catch (e) { location.href = RETURN_TO; }
    }
    window.addEventListener('blur', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('pagehide', function () {
      if (launched) blurredAfterLaunch = true;
    });
    window.addEventListener('focus', function () {
      var enoughDelay = launchAtMs > 0 && (Date.now() - launchAtMs) > 1200;
      if (blurredAfterLaunch || (isInstagramIab && launched && enoughDelay)) setTimeout(goBack, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && blurredAfterLaunch) setTimeout(goBack, 150);
    });
    // Instagram in-app browser can fail to emit blur/visibility after mail compose.
    if (isInstagramIab) {
      setTimeout(function () {
        if (launched && !wentBack) goBack();
      }, 15000);
    }
    var done = document.getElementById('done-return');
    if (done) done.addEventListener('click', function (e) { e.preventDefault(); goBack(); });
  })();
  </script>
